function blankLedger(){return {version:1,tickets:0,lifetime:0,owned:[],favorites:[],notes:{},stats:{},boothFirst:[],bonuses:[],parade:false,history:[],totalCorrect:0,totalAsked:0,earnedByBooth:{},playedAt:Date.now()}}

function sayWrong(label,reason){game.attempts++;game.hp=Math.max(1,game.hp-1);game.mistakes.push({zone:active,question:label,why:reason,date:new Date().toISOString()});if(game.mistakes.length>120)game.mistakes=game.mistakes.slice(-120);save();alertToast('⚔ Not quite. −1 resolve. '+reason.slice(0,105))}

function drawEncounter(){$('hp').textContent='♥ '+game.hp;$('balance').textContent=fmt(getLedger().tickets)+' 🎟';const c=game.config[active],ch=CHAPTERS.find(x=>x.id===active);if(!c||!ch){active=null;draw();return}let body='';if(active==='echo'){const item=ECHOES[c.order[c.pos]];body='<p>Read the situation, then assign it to one of the three enchanted wards. <b>'+(c.pos+1)+'/6</b> curses lifted.</p><div class="pickCard"><strong>👤 Patient clue</strong><p>'+esc(item.t)+'</p></div><div class="triptych">'+['Overload','Deprivation','Deficit'].map(x=>'<button class="choice" data-echo="'+x+'"><span class="glyph">'+({Overload:'🔊',Deprivation:'🌑',Deficit:'🦻'}[x])+'</span>'+x+'</button>').join('')+'</div><p class="dim">The patient is not a monster. The environment might be.</p>'}

if(active==='chamber'){const e=ENVS[c.order[c.pos]],nums=c.knobs;const labels=[['Quiet','Comfortable','Noisy'],['Dark','Soft','Bright'],['Alone','Check-ins','Engaged']];body='<p>Move the three environment controls until the patient benefits. Press <b>Apply your care plan</b> to test the room. <b>'+(c.pos+1)+'/3</b> rooms.</p><div class="pickCard"><strong>🏮 '+esc(e.title)+'</strong><p>'+esc(e.story)+'</p></div><div class="meterRows">'+['Sound','Lighting','Interaction'].map((n,j)=>'<label class="meter"><strong>'+n+'</strong><input type="range" min="0" max="2" step="1" value="'+nums[j]+'" data-knob="'+j+'"><span data-knoblabel="'+j+'">'+labels[j][nums[j]]+'</span></label>').join('')+'</div>'+(e.aid?'<label class="choice" style="display:block;text-align:left"><input type="checkbox" id="hearingAids" '+(c.aid?'checked':'')+'> Restore the patient’s hearing aids</label>':'')+'<div class="buttonRow">'+btn('✨ Apply your care plan','applyEnv')+'</div>'}

if(active==='scribe'){const m=MMSE_CASES[c.order[c.pos]];body='<p>The scribe has five scoring fields. Enter the values reported in the case, calculate the total, and interpret the screening result. <b>'+(c.pos+1)+'/3</b> ledgers.</p><div class="pickCard"><strong>📜 Clinical record</strong><p>'+esc(m.story)+'</p></div>'+['Orientation (0–10)','Registration (0–3)','Attention (0–5)','Recall (0–3)','Language (0–9)'].map((name,j)=>'<label class="scoreRow"><span>'+name+'</span><input type="number" inputmode="numeric" min="0" max="'+[10,3,5,3,9][j]+'" value="" data-mmse="'+j+'" aria-label="'+name+'"></label>').join('')+'<label class="scoreRow"><b>TOTAL / 30</b><input id="mmseTotal" type="number" inputmode="numeric" min="0" max="30" aria-label="Total MMSE score"></label><p class="dim">Remember: an MMSE score is a screen, not a standalone dementia diagnosis.</p><div class="buttonRow">'+btn('🪶 Verify the ledger','checkMMSE')+'</div>'}

function progressOne(label,why,total){const c=game.config[active];sayRight(label,why);c.pos++;save();if(c.pos>=total)finishZone();else{drawEncounter();alertToast('✦ Correct! '+why.slice(0,125))}}
function echoPick(x){const c=game.config.echo,item=ECHOES[c.order[c.pos]];if(x===item.a)progressOne(item.t,item.why,6);else{c.miss++;sayWrong(item.t,item.why);drawEncounter()}}

function checkMMSE(){const c=game.config.scribe,m=MMSE_CASES[c.order[c.pos]],inputs=[...document.querySelectorAll('[data-mmse]')];const vals=inputs.map(x=>x.value===''?NaN:Number(x.value)),total=Number($('mmseTotal').value);if(vals.every((x,j)=>x===m.vals[j])&&$('mmseTotal').value!==''&&total===m.vals.reduce((a,b)=>a+b,0))progressOne(m.story,m.why,3);else{c.miss++;sayWrong(m.story,'Recheck the five domain values and sum them; hearing/vision barriers affect interpretation.');save()}}
function toggle(arr,index,max){const p=arr.indexOf(index);if(p>=0)arr.splice(p,1);else if(arr.length<max)arr.push(index)}

function bossStep(ix){const c=game.config.boss;if(!c.sequence.includes(ix))c.sequence.push(ix);save();drawEncounter()}

function drawShop(){const money=getLedger().tickets;let html='<div class="parchment"><div class="kicker">GUILD REDEMPTION COUNTER</div><h2>⚔️ The Dragon Merchant</h2><p>These rewards join your <b>existing carnival ticket wallet</b>. Legendary artifacts require quest progress as well as tickets. The expensive prizes are designed for future adventures, not one shopping spree.</p><span class="pill">🎟 '+fmt(money)+' tickets</span></div><div class="section"><h2>New fantasy relics</h2><span class="pill">Persistent collectibles</span></div><section class="shopGrid">'+NEW_PRIZES.map(prizeCard).join('')+'</section><div class="section"><h2>Midnight Midway collection</h2><span class="pill">Your classic rewards</span></div><section class="shopGrid">'+CLASSIC.map(prizeCard).join('')+'</section>';$('content').innerHTML=html}
function prizeCard(p){const own=owned(p.id),unlock=unlocked(p),allow=!p.unlock||unlock;return '<article class="prize"><div class="art">'+p.icon+'</div><small>'+p.rarity+' · '+(p.classic?'Midway':'Veil of Senses')+'</small><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'A collectible from the carnival that shares your ticket wallet.')+'</p><strong class="price">'+(own?'✓ Owned':p.price==null?'Quest exclusive':'🎟 '+fmt(p.price))+'</strong>'+(allow||own?'':'<small>🔒 Complete '+esc(CHAPTERS.find(x=>x.id===p.unlock)?.name||p.unlock)+' first</small>')+'<button class="action '+(own?'secondary':'')+'" data-prize="'+p.id+'" '+(!own&&(!allow||p.price==null||getLedger().tickets<p.price)?'disabled':'')+'>'+ (own?'View in gallery':!allow?'Locked':'Redeem')+'</button></article>'}
function drawGallery(){const x=getLedger();const own=x.owned;let arr=own.map(id=>PRIZES.find(p=>p.id===id)||{id,name:id,icon:'💎',rarity:'Unknown',pearl:'A previous collectible saved in your shared wallet.'});$('content').innerHTML='<div class="parchment"><div class="kicker">THE SHARED STUDY GALLERY</div><h2>🏆 Your Cabinet of Curiosities</h2><p>Every reward from the carnival and this adventure stays in the same wallet. Add your own nursing memory hooks. Your four previously reported prizes should appear automatically when played in the original Safari storage.</p><span class="pill">'+own.length+' collected · '+fmt(x.tickets)+' tickets remaining</span></div><div class="section"><h2>Your treasures</h2></div><section class="galleryGrid">'+(arr.length?arr.map(p=>'<article class="prize"><div class="art">'+p.icon+'</div><small>'+p.rarity+(x.favorites.includes(p.id)?' ★ FAVORITE':'')+'</small><h3>'+esc(p.name)+'</h3><p>'+esc(p.pearl)+'</p><button class="action secondary" data-detail="'+p.id+'">📚 Open & annotate</button></article>').join(''):'<p class="parchment">Your trophy shelves are waiting. Collect your first relic at the Guild Merchant.</p>')+'</section>'}
function detail(id){const x=getLedger(),p=PRIZES.find(p=>p.id===id);if(!x.owned.includes(id))return;const fav=x.favorites.includes(id);const note=x.notes[id]||'';openModal('<div class="kicker">GALLERY COLLECTION · '+esc(p?.rarity||'Trophy')+'</div><h2>'+esc(p?.icon||'💎')+' '+esc(p?.name||id)+'</h2><p>'+esc(p?.pearl||'An artifact from your study adventures.')+'</p><label for="noteText">Your study mnemonic or memory hook</label><textarea id="noteText" class="note" maxlength="1200">'+esc(note)+'</textarea><div class="buttonRow">'+btn('💾 Save note','saveNote')+btn(fav?'★ Unfavorite':'☆ Favorite','favorite','secondary')+btn('Back','close','secondary')+'</div>');$('modal').dataset.prize=id}
function drawJournal(){const x=getLedger();const errors=game.mistakes.slice().reverse();$('content').innerHTML='<div class="parchment"><div class="kicker">THE ADVENTURER CHRONICLE</div><h2>📜 Quest record & saved treasures</h2><p>You have completed '+game.done.length+' of 6 story chapters, earned '+game.xp+' experience, and collected '+x.owned.length+' treasures.</p><p>Guild balance: <b>🎟 '+fmt(x.tickets)+'</b> · Lifetime tickets: <b>'+fmt(x.lifetime)+'</b></p><div class="buttonRow">'+btn('📋 Copy study report','export')+btn('💾 Backup combined save','backup','secondary')+btn('📥 Restore carnival backup','restore','secondary')+btn('⚔ Restart quest only','restart','warn')+'</div></div><div class="section"><h2>Areas to revisit</h2><span class="pill">'+errors.length+' incorrect attempts</span></div><section class="journal">'+(errors.length?errors.slice(0,50).map(m=>'<div class="journalRow"><b>'+esc(CHAPTERS.find(c=>c.id===m.zone)?.name||m.zone)+'</b><p>'+esc(m.question)+'</p><small>'+esc(m.why)+'</small></div>').join(''):'<p>No logged errors yet. The dragon is concerned.</p>')+'</section>'}
function reportText(){const x=getLedger();return ['WARD 13 — THE VEIL OF SENSES RPG STUDY REPORT','Character: '+(game.cls?CLASSES[game.cls].name:'Not chosen'),'Chapters completed: '+game.done.length+'/6','Experience: '+game.xp,'Missed attempts: '+game.mistakes.length,'Tickets available (shared with Midnight Midway): '+x.tickets,'Tickets earned lifetime: '+x.lifetime,'Collectibles: '+x.owned.map(id=>PRIZES.find(p=>p.id===id)?.name||id).join(', '),'','CHAPTERS',...CHAPTERS.map(c=>c.name+': '+(game.done.includes(c.id)?'Cleared':'Not cleared')),'','MISTAKES',...game.mistakes.map(m=>m.zone+': '+m.question+' | '+m.why)].join('\n')}
function exportText(kind){let s=kind==='report'?reportText():JSON.stringify({rpg:game,carnival:getLedger()},null,2);openModal('<h2>'+ (kind==='report'?'📋 Share your clinical report':'💾 Back up both games')+'</h2><p>Copy this text to save or share. Your data is not sent to a server automatically.</p><textarea id="exportBox" class="note" style="min-height:255px"></textarea><div class="buttonRow">'+btn('📋 Copy text','copy')+btn('Close','close','secondary')+'</div>');$('exportBox').value=s}
function restoreDialog(){openModal('<h2>📥 Restore a saved carnival wallet</h2><p>Paste the exact JSON backup from the Carnival Results tab. This replaces the shared carnival wallet on this browser; your D&D adventure progress stays separate.</p><textarea id="restoreBox" class="note" style="min-height:190px"></textarea><div class="buttonRow">'+btn('Restore wallet','restoreApply')+btn('Cancel','close','secondary')+'</div>')}
function restoreApply(){try{const txt=$('restoreBox').value,rec=JSON.parse(txt);const data=rec.carnival||rec;if(data.version!==1||!Array.isArray(data.owned)||!Number.isFinite(data.tickets)||data.tickets<0)throw Error('Invalid wallet');if(!confirm('Replace this browser’s current carnival ticket wallet and collection?'))return;storeLedger({...blankLedger(),...data});closeModal();alertToast('🎟 Wallet restored')}catch(e){alertToast('Invalid backup; no data changed')}}
function importSnapshot(){if(hasLedger()){alertToast('Existing wallet detected; import skipped to protect your saves.');return}if(!confirm('Import your last SHARED report: 3,488 tickets, 5,638 lifetime and four prizes? Only use if this browser does not have newer carnival progress.'))return;const x=blankLedger();x.tickets=3488;x.lifetime=5638;x.owned=['parade','fortuneDeck','crown','ferris'];x.parade=true;x.boothFirst=['toss','balloon','fortune','morse','whack','mirror','carousel'];x.totalCorrect=46;x.totalAsked=49;storeLedger(x);draw();alertToast('🎟 Snapshot imported. Your reported four prizes are restored.')}
function purchase(id){const p=PRIZES.find(z=>z.id===id);if(!p||p.price==null||!unlocked(p))return;if(spend(p)){draw();alertToast('🏆 '+p.name+' added to your shared gallery!')}else alertToast('Insufficient tickets or already owned.')}
document.addEventListener('click',async ev=>{
const b=ev.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.nav){view=b.dataset.nav;active=null;closeOverlayOnly();draw();return}
if(b.dataset.class){if(!game.cls){game.cls=b.dataset.class;save();draw()}return}
if(b.dataset.enter){enter(b.dataset.enter);return}
if(b.dataset.echo){echoPick(b.dataset.echo);return}
if(b.dataset.nerve!==undefined){nervePick(Number(b.dataset.nerve));return}
if(b.dataset.domain!==undefined){domainPick(Number(b.dataset.domain));return}
if(b.dataset.knob!==undefined)return;
if(b.dataset.bossclue!==undefined){bossClue(Number(b.dataset.bossclue));return}
if(b.dataset.bossstep!==undefined){bossStep(Number(b.dataset.bossstep));return}
if(b.dataset.bossinter!==undefined){bossInter(Number(b.dataset.bossinter));return}
if(b.dataset.prize){if(owned(b.dataset.prize)) {view='gallery';draw();detail(b.dataset.prize)}else purchase(b.dataset.prize);return}
if(b.dataset.detail){detail(b.dataset.detail);return}
const a=b.dataset.act;if(!a)return;
if(a==='leave'){active=null;draw();return}
if(a==='applyEnv'){applyEnv();return}
if(a==='checkMMSE'){checkMMSE();return}
if(a==='sealClues'){sealClues();return}
if(a==='sealSteps'){sealSteps();return}
if(a==='bossUndo'){game.config.boss.sequence.pop();save();drawEncounter();return}
if(a==='sealInter'){sealInter();return}
if(a==='roll'||a==='rules'){rollLoot();return}
if(a==='close'){closeModal();return}
if(a==='export'){exportText('report');return}
if(a==='backup'){exportText('backup');return}
if(a==='restore'){restoreDialog();return}
if(a==='restoreApply'){restoreApply();return}
if(a==='snapshot'){importSnapshot();return}
if(a==='copy'){const ta=$('exportBox');try{await navigator.clipboard.writeText(ta.value);alertToast('Copied to clipboard!')}catch(e){ta.focus();ta.select();alertToast('Select the highlighted text and choose Copy.')}return}
if(a==='saveNote'){const id=$('modal').dataset.prize;wallet(x=>{if(x.owned.includes(id))x.notes[id]=$('noteText').value.slice(0,1200)});alertToast('Your study note was saved!');return}
if(a==='favorite'){const id=$('modal').dataset.prize;wallet(x=>{if(x.owned.includes(id))x.favorites=x.favorites.includes(id)?x.favorites.filter(z=>z!==id):x.favorites.concat(id)});detail(id);draw();return}
if(a==='restart'){if(!confirm('Restart this D&D quest? Your carnival tickets, purchased prizes, and gallery notes are preserved.'))return;game=blankRpg();save();view='adventure';draw();alertToast('New quest created. Guild treasures were not touched.');return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.knob===undefined)return;if(!active||active!=='chamber')return;const j=Number(el.dataset.knob),c=game.config.chamber;const names=[['Quiet','Comfortable','Noisy'],['Dark','Soft','Bright'],['Alone','Check-ins','Engaged']];c.knobs[j]=Number(el.value);document.querySelector('[data-knoblabel="'+j+'"]').textContent=names[j][c.knobs[j]];save()});
function closeOverlayOnly(){$('overlay').classList.remove('open');document.body.style.overflow=''}
if(game.pendingRolls.length&&game.cls){setTimeout(()=>alertToast('🎲 You have an unclaimed first-clear treasure roll!'),750)}
draw();
</script>
</body>
</html>
