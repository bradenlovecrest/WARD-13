name: WARD 13 Voice Studio (manual)

on:
  workflow_dispatch:
    inputs:
      cue:
        description: N.U.R.S.E. dialogue
        required: true
        type: choice
        default: welcome
        options:
          - welcome
          - security
          - fracture
          - custom
      custom_line:
        description: Dialogue if cue is custom (max 700 characters)
        required: false
        type: string
      mode:
        description: Preview is free; Generate requests new audio
        required: true
        type: choice
        default: preview
        options:
          - preview
          - generate
      confirm_rights:
        description: I may share this generated recording in a publicly accessible GitHub artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  voice-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preview or generate N.U.R.S.E. with Google Gemini Tavi
        env:
          WARD_CUE: ${{ inputs.cue }}
          WARD_CUSTOM_LINE: ${{ inputs.custom_line }}
          WARD_MODE: ${{ inputs.mode }}
          WARD_RIGHTS: ${{ inputs.confirm_rights }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$WARD_MODE" = "generate" ]; then
            python -m pip install --quiet "google-genai>=2.30.1,<3"
          fi
          python tools/nurse_voice_studio.py
      - name: Download Tavi voice recording (public repository artifact)
        if: ${{ inputs.mode == 'generate' }}
        uses: actions/upload-artifact@v4
        with:
          name: ward13-tavi-${{ inputs.cue }}-${{ github.run_number }}
          path: voice-output/
          retention-days: 1
