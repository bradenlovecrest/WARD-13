name: WARD 13 NURS 316 Exam 3 QA
on:
  push:
    branches: [main]
    paths:
      - "playtest/cinematic-episode/n316*"
      - "playtest/cinematic-episode/nurse-tavi.js"
      - "playtest/cinematic-episode/assets/tavi-story/**"
      - "playtest/cinematic-episode/assets/n316*"
      - "tools/check_n316_campaign.mjs"
      - "tools/test_n316_campaign_browser.mjs"
      - "tools/audit_n316_browser.mjs"
      - ".github/workflows/n316-campaign-smoke.yml"
  pull_request:
    paths:
      - "playtest/cinematic-episode/n316*"
      - "playtest/cinematic-episode/nurse-tavi.js"
      - "playtest/cinematic-episode/assets/tavi-story/**"
      - "playtest/cinematic-episode/assets/n316*"
      - "tools/check_n316_campaign.mjs"
      - "tools/test_n316_campaign_browser.mjs"
      - ".github/workflows/n316-campaign-smoke.yml"
permissions:
  contents: read
jobs:
  n316-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify instructor-review-aligned 40-item bank and source art
        run: node tools/check_n316_campaign.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Play full N316 campaign at iPhone viewport
        run: node tools/test_n316_campaign_browser.mjs
      - name: Audit actual audio decode and scenic controls at five widths
        run: node tools/audit_n316_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n316-qa-screenshots
          path: artifacts/n316-audit/
          if-no-files-found: ignore
          retention-days: 7
