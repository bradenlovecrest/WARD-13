name: WARD 13 Cinematic Campaign QA
on:
  pull_request:
    paths:
      - "playtest/cinematic-episode/**"
      - "tools/check_cinematic_campaign.mjs"
      - "tools/test_cinematic_campaign_browser.mjs"
      - ".github/workflows/cinematic-campaign-smoke.yml"
  push:
    branches: [main]
    paths:
      - "playtest/cinematic-episode/**"
      - "tools/check_cinematic_campaign.mjs"
      - "tools/test_cinematic_campaign_browser.mjs"
      - ".github/workflows/cinematic-campaign-smoke.yml"

permissions:
  contents: read

jobs:
  cinematic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original clinical engine, images, and isolated saves
        run: node tools/check_cinematic_campaign.mjs
      - name: Install mobile browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Play all four rooms and Patient 004 encounter in mobile Chromium
        run: node tools/test_cinematic_campaign_browser.mjs
