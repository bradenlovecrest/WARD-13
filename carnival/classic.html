function close(){dialog=null;active=null;$('overlay').classList.remove('open');document.body.style.overflow='';$('modal').innerHTML='';render();showPendingBonus()}
function addHistory(booth,question,yours,correctAnswer,correct,why){state.history.push({booth,question,yours,answer:correctAnswer,correct,why,date:new Date().toISOString()});if(state.history.length>220)state.history=state.history.slice(-220);state.totalAsked++;if(correct)state.totalCorrect++}
function startBooth(id){const booth=BOOTHS.find(b=>b.id===id);if(!booth)return;active={id,kind:booth.type,earned:0,correct:0,asked:0,stage:0,phase:'playing',nonce:Date.now()+Math.random(),details:[]};if(booth.type==='quiz'){const pool=Q[id];active.questions=shuffle(pool).slice(0,id==='wheel'?4:5);active.optionOrder=shuffle([0,1,2,3])}else if(booth.type==='whack'){active.questions=shuffle(WHACK).slice(0,10)}else if(booth.type==='memory'){const selected=shuffle(PAIRS).slice(0,6);active.deck=shuffle(selected.flatMap(([a,b],pid)=>[{pid,label:a},{pid,label:b}]));active.revealed=[];active.matched=[];active.moves=0;active.busy=false}else if(booth.type==='sequence'){active.seqs=shuffle(SEQUENCES);active.seqOrder=shuffle([0,1,2,3]);active.selected=[];active.attempts=0;active.phase='playing'}renderActive();sound('bonus')}
function earnInBooth(n){earn(n);active.earned+=n}
function shell(booth,body){return `<div class="modalKicker">${booth.icon} ${esc(booth.kicker)}</div><h2>${esc(booth.name)}</h2><div class="medals"><span class="medal">🎟 ${fmt(active.earned)} earned this visit</span><span class="medal">✓ ${active.correct} right</span></div>${body}`}
function renderActive(){if(!active)return;const b=BOOTHS.find(x=>x.id===active.id);if(active.kind==='quiz')return renderQuiz(b);if(active.kind==='whack')return renderWhack(b);if(active.kind==='memory')return renderMemory(b);if(active.kind==='sequence')return renderSequence(b)}
function renderQuiz(b){const a=active,q=a.questions[a.stage];if(!q)return finishBooth();const count=a.questions.length,order=a.optionOrder;if(a.phase==='feedback'){open(shell(b,`<div class="kicker">QUESTION ${a.stage+1} / ${count}</div><div class="qText">${esc(q.q)}</div><div class="feedback ${a.selected===q.c?'good':'bad'}"><strong>${a.selected===q.c?'🎉 PERFECT TOSS':'👻 THE CARNIVAL DISAGREES'}</strong><p>${a.selected===q.c?'You landed it!':'Correct answer: '+esc(q.a[q.c])}</p><p>${esc(q.why)}</p><div class="ticker">${a.lastReward>=40?'+':'+'}${a.lastReward} TICKETS</div></div><div class="rowBtns"><button class="btn mint" data-act="next">${a.stage+1<count?'Next attraction →':'Collect booth tickets →'}</button></div>`));return}
const options=order.map((idx,k)=>`<button class="choice" data-answer="${idx}"><span class="choiceLetter">${'ABCD'[k]}</span><span>${esc(q.a[idx])}</span></button>`).join('');open(shell(b,`<div class="kicker">QUESTION ${a.stage+1} / ${count}</div><div class="progress"><i style="width:${a.stage/count*100}%"></i></div><div class="qText">${esc(q.q)}</div><div class="choiceGrid">${options}</div><p class="tiny">Correct answers win ${b.id==='wheel'?'70':'55–60'} tickets. Every wrong answer reveals the rationale. No timer; accuracy first.</p>`))}
function answerQuiz(idx){const a=active;if(!a||a.kind!=='quiz'||a.phase!=='playing')return;const b=BOOTHS.find(x=>x.id===a.id),q=a.questions[a.stage];const ok=idx===q.c;const base=a.id==='wheel'?70:a.id==='fortune'?60:55;const jackpot=ok&&Math.random()<.08?75:0;const reward=(ok?base:10)+jackpot;earnInBooth(reward);a.asked++;if(ok)a.correct++;a.selected=idx;a.lastReward=reward;a.phase='feedback';addHistory(a.id,q.q,q.a[idx],q.a[q.c],ok,q.why);save();sound(ok?'good':'bad');renderQuiz(b);if(jackpot)toast('🎟️ GOLDEN RING BONUS +75 EXTRA TICKETS!')}
function nextQuiz(){if(!active)return;active.stage++;active.phase='playing';active.optionOrder=shuffle([0,1,2,3]);renderActive()}
function renderWhack(b){const a=active,q=a.questions[a.stage];if(!q)return finishBooth();if(a.phase==='feedback'){open(shell(b,`<div class="kicker">TARGET ${a.stage+1} / ${a.questions.length}</div><div class="qText">${esc(q.t)}</div><div class="feedback ${a.selected===q.safe?'good':'bad'}"><strong>${a.selected===q.safe?'🔨 HAZARD HANDLED':'😱 A CARNIVAL MISHAP'}</strong><p><b>${q.safe?'SAFE ACTION':'UNSAFE ACTION'}</b> · ${esc(q.why)}</p><div class="ticker">+${a.lastReward} TICKETS</div></div><div class="rowBtns"><button class="btn mint" data-act="next">${a.stage+1<a.questions.length?'Next target →':'Count my tickets →'}</button></div>`));return}
open(shell(b,`<p class="tiny" style="margin-top:10px">Target ${a.stage+1} / ${a.questions.length} · Is this nursing action safe?</p><div class="progress"><i style="width:${a.stage/a.questions.length*100}%"></i></div><div class="qText">“${esc(q.t)}”</div><div class="whackButtons"><button class="btn mint" data-safe="true">✅ SAFE</button><button class="btn pink" data-safe="false">🔨 UNSAFE!</button></div><p class="tiny" style="margin-top:15px">No pressure timer—this is a study carnival, not a simulation of actual patient harm.</p>`))}
function answerWhack(safe){const a=active;if(!a||a.kind!=='whack'||a.phase!=='playing')return;const q=a.questions[a.stage],ok=safe===q.safe;const award=ok?27:5;earnInBooth(award);a.asked++;if(ok)a.correct++;a.lastReward=award;a.selected=safe;a.phase='feedback';addHistory(a.id,q.t,safe?'Safe':'Unsafe',q.safe?'Safe':'Unsafe',ok,q.why);save();sound(ok?'good':'bad');renderActive()}
function nextWhack(){active.stage++;active.phase='playing';renderActive()}
function renderMemory(b){const a=active;const tiles=a.deck.map((v,i)=>{const matched=a.matched.includes(v.pid),face=matched||a.revealed.includes(i);return `<button class="memory ${matched?'matched':face?'revealed':''}" data-flip="${i}" ${matched||a.busy?'disabled':''} aria-label="${face?esc(v.label):'Hidden card '+(i+1)}">${face?esc(v.label):'<span class="memoryBack">✧</span>'}</button>`}).join('');open(shell(b,`<div class="callout">Match six clinical findings to their corresponding diagnoses or nursing concepts. The prize depends on how few turns you need.</div><div class="medals"><span class="medal">${a.matched.length}/6 matches</span><span class="medal">${a.moves} attempts</span></div><div class="memoryGrid">${tiles}</div><div class="rowBtns"><button class="btn secondary" data-act="memoryShuffle">↻ New shuffle (resets this puzzle)</button><button class="btn secondary" data-act="memorySkip">Skip puzzle</button></div>`))}
function flipMemory(idx){const a=active;if(!a||a.kind!=='memory'||a.busy||a.revealed.includes(idx)||a.matched.includes(a.deck[idx].pid))return;a.revealed.push(idx);if(a.revealed.length===2){a.moves++;const [i,j]=a.revealed;if(a.deck[i].pid===a.deck[j].pid){a.matched.push(a.deck[i].pid);a.revealed=[];a.correct++;a.asked++;earnInBooth(35);sound('good');if(a.matched.length===6){const bonus=Math.max(20,160-(a.moves-6)*15);earnInBooth(bonus);a.details.push('Completed mirror vault in '+a.moves+' attempts');setTimeout(()=>{if(active===a)finishBooth()},450);return}}else{a.busy=true;const nonce=a.nonce;renderMemory(BOOTHS.find(b=>b.id===a.id));setTimeout(()=>{if(!active||active.nonce!==nonce)return;active.revealed=[];active.busy=false;renderActive()},1050);return}}renderActive()}
function shuffleMemory(){const a=active;if(!a||a.kind!=='memory')return;a.nonce=Date.now()+Math.random();a.deck=shuffle(a.deck);a.revealed=[];a.matched=[];a.moves=0;a.busy=false;a.correct=0;a.asked=0;renderActive()}
function renderSequence(b){const a=active,seq=a.seqs[a.stage];if(!seq)return finishBooth();if(a.phase==='feedback'){open(shell(b,`<div class="kicker">CAROUSEL ${a.stage+1} / ${a.seqs.length}</div><div class="feedback good"><h3>🎠 The ride is running again!</h3><p>${esc(seq.why)}</p><p>Correct simplified order: ${seq.actions.map(x=>esc(x[1])).join(' → ')}</p><div class="ticker">+${a.lastReward} TICKETS</div></div><div class="rowBtns"><button class="btn mint" data-act="next">${a.stage+1<a.seqs.length?'Next carousel →':'Redeem ride tickets →'}</button></div>`));return}
const opts=a.seqOrder.map((idx,i)=>{const step=seq.actions[idx];return `<button class="step" data-step="${idx}" ${a.selected.includes(idx)?'disabled':''}><span class="stepNo">${a.selected.includes(idx)?'✓':'↳'}</span>${esc(step[1])}</button>`}).join('');open(shell(b,`<div class="kicker">CAROUSEL ${a.stage+1} / ${a.seqs.length} · ${esc(seq.title)}</div><div class="callout">${esc(seq.case)}</div><p class="tiny">Tap the four actions in the best simplified sequence.</p><div class="orderList">${opts}</div><div class="queue">${a.selected.length?a.selected.map((idx,n)=>`<div><span class="num">${n+1}</span>${esc(seq.actions[idx][1])}</div>`).join(''):'Build your sequence above…'}</div><div class="rowBtns"><button class="btn secondary" data-act="seqUndo">↶ Undo</button><button class="btn mint" data-act="seqCheck" ${a.selected.length!==4?'disabled':''}>Unlock carousel 🔓</button></div>${a.attempts?`<div class="feedback bad">Incorrect sequence previously. Attempts: ${a.attempts}. Try another order.</div>`:''}`))}
function chooseSequence(idx){const a=active;if(!a||a.kind!=='sequence'||a.selected.includes(idx))return;a.selected.push(idx);renderActive()}
function checkSequence(){const a=active;if(!a||a.kind!=='sequence'||a.selected.length!==4)return;const seq=a.seqs[a.stage];const correct=a.selected.join(',')==='0,1,2,3';if(correct){const reward=Math.max(40,115-a.attempts*25);earnInBooth(reward);a.asked++;a.correct++;a.lastReward=reward;a.phase='feedback';addHistory(a.id,seq.title+' — '+seq.case,'Correct order','Correct order',true,seq.why);sound('good');renderActive()}else{a.attempts++;a.asked++;addHistory(a.id,seq.title+' — '+seq.case,a.selected.map(i=>seq.actions[i][1]).join(' → '),seq.actions.map(x=>x[1]).join(' → '),false,seq.why);a.selected=[];a.seqOrder=shuffle([0,1,2,3]);toast('🎠 The horses bucked. Try another sequence!');sound('bad');renderActive()}}
function nextSequence(){const a=active;a.stage++;a.phase='playing';a.selected=[];a.attempts=0;a.seqOrder=shuffle([0,1,2,3]);renderActive()}
function finishBooth(){if(!active)return;const a=active,b=BOOTHS.find(x=>x.id===a.id),first=!state.boothFirst.includes(a.id);if(first){state.boothFirst.push(a.id);earnInBooth(85)}state.stats[a.id]??={plays:0,correct:0,asked:0,best:0};state.stats[a.id].plays++;state.stats[a.id].correct+=a.correct;state.stats[a.id].asked+=a.asked;state.stats[a.id].best=Math.max(state.stats[a.id].best,a.correct);state.earnedByBooth[a.id]=(state.earnedByBooth[a.id]||0)+a.earned;save();const score=a.asked?Math.round(a.correct/a.asked*100):100;active=null;open(`<div class="modalKicker">🎪 SIDESHOW SURVIVED · ${esc(b.name)}</div><h2>${first?'Your first official midway stamp!':'Another visit, another suspicious paycheck.'}</h2><div class="ticketBurst">🎟 +${fmt(a.earned)}</div><p style="text-align:center">${a.asked?`${a.correct}/${a.asked} challenges correct (${score}%)`:`Six clinical mirror pairs found in ${a.moves} attempts`}${first?' · Includes your 85-ticket first-clear bonus!':''}</p><div class="callout">N.U.R.S.E. // “Your competence has been reported to the carnival's liability department.”</div><div class="rowBtns"><button class="btn mint" data-action="close">Return to the midway</button><button class="btn secondary" data-action="shopAfter">Spend my tickets 🎁</button></div>`);sound('bonus')}
function pendingBonus(){return [2,4,6].find(n=>state.boothFirst.length>=n&&!state.bonuses.includes(n))}
function showPendingBonus(){const n=pendingBonus();if(!n)return;open(`<div class="modalKicker">🎟️ THE GOLDEN TICKET CURSE · MILESTONE ${n}/7</div><h2>N.U.R.S.E. found three sealed parcels.</h2><p>Choose one. Each parcel contains a different pile of bonus tickets. No wrong answers, but suspiciously enthusiastic customer service.</p><div class="giftBoxes">${[0,1,2].map(i=>`<button class="gift" data-bonus="${i}">🎁<small>BOX ${i+1}</small></button>`).join('')}</div>`)}
function chooseBonus(idx){const n=pendingBonus();if(!n)return;const amounts=shuffle(n===2?[70,110,150]:n===4?[120,170,230]:[170,250,330]);const value=amounts[idx];earn(value);state.bonuses.push(n);save();open(`<div class="modalKicker">BONUS PARCEL OPENED</div><h2>🎉 No refunds. No hauntings returned.</h2><div class="ticketBurst">+${fmt(value)} 🎟</div><p style="text-align:center">Bonus milestone ${n}/7 claimed! The other two parcels dissolve into ectoplasm.</p><div class="rowBtns"><button class="btn mint" data-action="close">Back to the midway</button><button class="btn secondary" data-action="shopAfter">Browse the curios</button></div>`);sound('good')}
function parade(){const all=BOOTHS.every(b=>state.boothFirst.includes(b.id));if(!all){open(`<div class="modalKicker">GRAND PARADE · RESTRICTED</div><h2>Seven booths. One very dramatic finale.</h2><div class="parade">🎪🎠🎡</div><p>Clear all seven unique carnival booths to unlock a secret gallery collectible and 350 extra tickets.</p><div class="medals">${BOOTHS.map(b=>`<span class="medal">${b.icon} ${state.boothFirst.includes(b.id)?'✓':'🔒'} ${esc(b.name)}</span>`).join('')}</div><div class="rowBtns"><button class="btn mint" data-action="close">Back to the booths</button></div>`);return}if(!state.parade){state.parade=true;state.owned.push('parade');earn(350);save()}open(`<div class="modalKicker">THE MIDNIGHT MIDWAY · GRAND FINALE</div><h2>🎉 The parade is yours!</h2><div class="parade">🎠 👑 🎪 🎟️</div><div class="ticketBurst">+350 🎟</div><p style="text-align:center">You've earned the <b>Midway Master Relic</b> for your study gallery. N.U.R.S.E. has reluctantly filed a commendation.</p><div class="rowBtns"><button class="btn mint" data-action="galleryAfter">See your mythical collectible →</button><button class="btn secondary" data-action="close">Return to the midway</button></div>`);sound('good')}
function prizeDetail(id){const p=PRIZES.find(x=>x.id===id);if(!p)return;const own=state.owned.includes(id),fav=state.favorites.includes(id);const note=state.notes[id]||'';const price=p.price;open(`<div class="modalKicker">${esc(p.rarity)} · ${esc(p.topic)} · ${own?'ON YOUR SHELF':'AT THE PRIZE COUNTER'}</div><h2>${esc(p.name)}</h2>${art(p,!own)}<p style="text-align:center">${esc(p.desc)}</p>${own?`<div class="callout"><b>📚 CLINICAL PEARL</b><p>${esc(p.pearl)}</p></div><label class="tiny" for="note">MY STUDY MEMORY HOOK / NOTES</label><textarea class="field" id="note" placeholder="Write a quick mnemonic or clinical reminder…">${esc(note)}</textarea><div class="rowBtns"><button class="btn mint" data-save-note="${id}">💾 Save my note</button><button class="btn secondary" data-fav="${id}">${fav?'★ Unfavorite':'☆ Add to favorites'}</button></div>`:`<div class="callout">🔒 Its clinical pearl is hidden until you collect it. ${price==null?'Unlock this relic by clearing all seven booths.':'Cost: 🎟 '+fmt(price)+' · You have '+fmt(state.tickets)+' tickets.'}</div><div class="rowBtns"><button class="btn pink" data-buy="${id}" ${price==null||state.tickets<price?'disabled':''}>🎁 ${price==null?'Grand Parade exclusive':state.tickets>=price?'Redeem for '+fmt(price)+' tickets':'Need '+fmt(Math.max(0,price-state.tickets))+' more tickets'}</button></div>`}<div class="rowBtns"><button class="btn secondary" data-action="close">Close</button></div>`)}
function buy(id){const p=PRIZES.find(x=>x.id===id);if(!p||p.price==null||state.owned.includes(id)||state.tickets<p.price)return;state.tickets-=p.price;state.owned.push(id);save();sound('good');prizeDetail(id);toast('🎁 '+p.name+' added to your study gallery!')}
function noteSave(id){if(!state.owned.includes(id))return;state.notes[id]=$('note')?.value.slice(0,1500)||'';save();toast('📚 Study note saved to this collectible!')}
function toggleFav(id){if(!state.owned.includes(id))return;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();prizeDetail(id)}
function reportText(){const l=['WARD 13 — MIDNIGHT MIDWAY STUDY REPORT','Clinical answers: '+state.totalCorrect+'/'+state.totalAsked+' ('+(state.totalAsked?Math.round(state.totalCorrect/state.totalAsked*100):0)+'%)','Booths cleared: '+state.boothFirst.length+'/7','Tickets currently available: '+fmt(state.tickets),'Tickets earned lifetime: '+fmt(state.lifetime),'Collectibles: '+state.owned.map(id=>PRIZES.find(p=>p.id===id)?.name||id).join(', '),'','BOOTH RESULTS'];BOOTHS.forEach(b=>{const x=state.stats[b.id]||{correct:0,asked:0,plays:0};l.push(b.name+': '+x.correct+'/'+x.asked+' correct; '+x.plays+' plays')});l.push('','RECENT MISSES');state.history.filter(x=>!x.correct).slice(-40).forEach(x=>l.push(x.booth+': '+x.question+'\nMy answer: '+x.yours+'\nCorrect: '+x.answer+'\nRationale: '+x.why,'---'));return l.join('\n')}
function share(which){const backup=which==='backup',value=backup?JSON.stringify(state):reportText();open(`<div class="modalKicker">${backup?'SAVE TRANSFER':'STUDY RESULTS EXPORT'}</div><h2>${backup?'Backup your haunted collection 💾':'Share your performance 📤'}</h2><p>${backup?'Copy this backup to your notes or another device. Restore it on this same game page using Results → Restore Save.':'Copy this text into ChatGPT. It includes your accuracy, prizes, and missed questions.'}</p><textarea id="exportBox" class="field" readonly style="min-height:230px" aria-label="${backup?'Backup text':'Results report'}"></textarea><div class="rowBtns"><button class="btn mint" data-action="copyExport">📋 Copy ${backup?'backup':'results'}</button><button class="btn secondary" data-action="close">Close</button></div><p class="caption">If Copy is blocked on iPhone, tap and hold the text, choose Select All, and then Copy.</p>`);$('exportBox').value=value}
function restore(){open(`<div class="modalKicker">RESTORE YOUR CARNIVAL COLLECTION</div><h2>📥 Unseal the old ticket ledger</h2><p>Paste a prior backup from this game. Restoring replaces your current tickets, gallery, and study records in this browser.</p><textarea id="restoreBox" class="field" style="min-height:170px" placeholder="Paste your saved game data here…"></textarea><div class="rowBtns"><button class="btn pink" data-action="doRestore">Restore this backup</button><button class="btn secondary" data-action="close">Cancel</button></div>`)}
function doRestore(){try{const s=JSON.parse($('restoreBox').value);if(s.version!==1||!Array.isArray(s.owned)||!Array.isArray(s.boothFirst)||!Array.isArray(s.history)||typeof s.tickets!=='number'||!Number.isFinite(s.tickets)||s.tickets<0)throw new Error('Incompatible or invalid backup');if(!confirm('Replace the current carnival save with this backup?'))return;state={...stateDefaults(),...s};save();close();toast('🎟️ Carnival save restored successfully!')}catch(e){toast('That backup could not be read. Check the copied text and try again.')}}
async function copyExport(){let value=$('exportBox').value;try{await navigator.clipboard.writeText(value);toast('Copied! Paste it into ChatGPT or a safe note.')}catch(e){$('exportBox').focus();$('exportBox').select();toast('Select the text and use Copy.')}}
function playAgain(){view='midway';close();document.getElementById('booths')?.scrollIntoView({block:'start',behavior:'smooth'})}
$('app').addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;const d=el.dataset;
if(d.nav){view=d.nav;close();window.scrollTo({top:0,behavior:'smooth'});return}
if(d.play){startBooth(d.play);return}
if(d.hero==='play'){document.getElementById('booths')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(d.answer!==undefined){answerQuiz(Number(d.answer));return}
if(d.safe!==undefined){answerWhack(d.safe==='true');return}
if(d.flip!==undefined){flipMemory(Number(d.flip));return}
if(d.step!==undefined){chooseSequence(Number(d.step));return}
if(d.bonus!==undefined){chooseBonus(Number(d.bonus));return}
if(d.prize){prizeDetail(d.prize);return}
if(d.buy){buy(d.buy);return}
if(d.saveNote){noteSave(d.saveNote);return}
if(d.fav){toggleFav(d.fav);return}
if(d.filter){galleryFilter=d.filter;renderGallery();return}
if(d.act==='next'){if(active?.kind==='quiz')nextQuiz();else if(active?.kind==='whack')nextWhack();else if(active?.kind==='sequence')nextSequence();return}
if(d.act==='memoryShuffle'){shuffleMemory();return}
if(d.act==='memorySkip'){close();toast('🪞 Mirror puzzle skipped. Replay it to earn your first-clear stamp!');return}
if(d.act==='seqUndo'){active?.selected.pop();renderActive();return}
if(d.act==='seqCheck'){checkSequence();return}
if(d.action==='close'){close();return}
if(d.action==='shopAfter'){view='shop';close();window.scrollTo(0,0);return}
if(d.action==='galleryAfter'){view='gallery';galleryFilter='owned';close();window.scrollTo(0,0);return}
if(d.action==='parade'){parade();return}
if(d.action==='sound'){sfx=!sfx;render();if(sfx)sound('bonus');return}
if(d.action==='share'){share('report');return}
if(d.action==='backup'){share('backup');return}
if(d.action==='restore'){restore();return}
if(d.action==='doRestore'){doRestore();return}
if(d.action==='copyExport'){copyExport();return}
});
render();
</script>
</body>
</html>
