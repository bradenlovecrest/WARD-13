/* Arcade Edition: seven genuinely interactive, illustrated midway attractions */
.arcadeCase{border:1px solid #b784a0;border-radius:16px;background:linear-gradient(130deg,#3a2446,#25182d);padding:17px 18px;margin:14px 0 12px;color:#fff0e2;font-size:1.05rem;line-height:1.5;box-shadow:inset 0 1px 0 #ffffff22}
.arcadeFooter{font-size:.79rem;color:var(--yellow);margin-top:12px;text-align:center}
.arcadeSub{text-align:center;font-weight:850;color:var(--yellow);font-size:1.1rem;letter-spacing:.03em}
.resultIcon{font-size:3.3rem;margin-bottom:2px}.clinicalReceipt{background:#1c1327;border:1px dashed #e7b37a;padding:11px;border-radius:10px;margin-top:13px;font-size:.84rem;color:var(--yellow)}
/* TOSS */
.ringArena{position:relative;isolation:isolate;border:4px solid #e69d76;border-radius:18px;min-height:356px;background:radial-gradient(ellipse at 48% 20%,#763d69 0%,#271b42 74%);overflow:hidden;padding:42px 12px 14px}
.ringArena:before{content:"";position:absolute;inset:0;opacity:.42;background:repeating-linear-gradient(90deg,transparent 0 42px,#ffd9b208 43px 45px);pointer-events:none}
.marqueeMini{position:absolute;top:6px;left:0;width:100%;text-align:center;color:#ffe1a0;font-size:.8rem;letter-spacing:.14em;font-weight:900}
.bottleShelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;gap:7px;min-height:214px;border-bottom:11px solid #b46a66;position:relative;z-index:1}
.bottleStand{position:relative;height:180px;min-width:0;border:1px solid #f4c07c80;background:linear-gradient(#fda07a24,#ffa2b625);border-radius:18px 18px 8px 8px;color:#fff1dc;display:flex;align-items:center;flex-direction:column;justify-content:center;padding:7px 3px;transition:transform .2s,border-color .2s}
.bottleStand:hover,.bottleStand:focus-visible,.bottleStand.landing{transform:translateY(-6px);border-color:#ffeeb4;box-shadow:0 0 22px #ffc4a860}
.bottleIcon{font-size:2.7rem;filter:drop-shadow(0 4px 5px #110c23)}.bottleNeck{height:35px;width:17px;border:3px solid #f0c67d;border-radius:5px;background:#e59fb22a;margin:3px auto}
.bottleLabel{font-size:.69rem;line-height:1.1;text-align:center;font-weight:800;padding:0 3px;min-height:29px;display:flex;align-items:center;justify-content:center}
.targetHalo{position:absolute;top:68px;left:calc(50% - 30px);width:60px;height:11px;border:2px solid #fff2aa;border-radius:50%;opacity:.55}
.ringLaunch{position:relative;height:76px;text-align:center;display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:5px}.ringProjectile{position:absolute;left:calc(50% - 37px);bottom:26px;font-size:4.6rem;line-height:.86;width:74px;height:65px;color:#8efadf;text-shadow:0 0 15px #85f8de,0 0 35px #5bf6df;cursor:grab;touch-action:none;z-index:6;user-select:none}
.ringProjectile.dragging{cursor:grabbing}.launchPlaque{font-size:.65rem;font-weight:900;letter-spacing:.13em;color:#ffe2a9}
/* BALLOON POP */
.balloonField{min-height:400px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;justify-items:center;gap:12px;border:3px dashed #b9779a;border-radius:20px;padding:24px 10px 34px;background:radial-gradient(circle at 50% 10%,#643754,#24162c 74%)}
.balloon{position:relative;border:0;color:#fff7ff;width:100%;max-width:180px;height:155px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;animation:balloonBob calc(2.2s + var(--i)*.19s) ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.51s)}
.balloonSkin{position:relative;width:100%;height:128px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.23;font-size:.74rem;font-weight:800;z-index:2;padding:12px 10px 19px;border-radius:53% 53% 48% 48% / 55% 55% 45% 45%;border:2px solid #ffebef82;background:radial-gradient(circle at 24% 20%,#ffffff78,transparent 34%),linear-gradient(135deg,hsla(var(--hue),75%,57%,.98),hsla(var(--hue),77%,27%,.93));box-shadow:inset -10px -12px 20px #38153390,0 14px 20px #0d071d77;text-shadow:0 1px 3px #100516}
.balloonSkin:after{content:"";position:absolute;bottom:-7px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid #e6a6c5}.balloonString{height:26px;width:2px;background:#fff4bc;transform:rotate(6deg)}
.balloon.exploding .balloonSkin{animation:popBlast .29s forwards}.balloon.exploding .balloonString{opacity:0}.balloon.popped{opacity:0;pointer-events:none}@keyframes balloonBob{from{transform:translateY(13px) rotate(-4deg)}to{transform:translateY(-13px) rotate(4deg)}}@keyframes popBlast{to{opacity:0;transform:scale(1.65) rotate(15deg);filter:blur(11px)}}

.crystalScene{padding:15px 4px;border-radius:20px;background:radial-gradient(ellipse at 50% 10%,#7752ab4e,#291f40 65%);margin:12px 0}.crystalOrb{position:relative;margin:0 auto 15px;width:130px;height:130px;border:4px solid #f9d8ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4rem;color:#b8f9fd;text-shadow:0 0 19px #fff,0 0 38px #ee88ff;background:radial-gradient(circle at 28% 20%,#f5e8ffaf,transparent 32%),radial-gradient(circle at 65% 80%,#6834aa,#332449 70%);box-shadow:0 0 45px #b683fb88,inset 0 0 25px #e8cbff70;animation:orbPulse 3s infinite ease-in-out}.crystalOrb small{position:absolute;font-size:1.4rem;right:17px;bottom:20px;color:#f5de7f}
.tarotRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tarot{min-height:132px;border:3px double #ffdca6;border-radius:11px;background:repeating-linear-gradient(40deg,#3e2558,#3e2558 9px,#57345e 9px,#57345e 17px);box-shadow:0 5px 14px #180d2d;display:grid;place-items:center;transition:transform .35s,background .35s;color:#f8e7ff;padding:12px;font-weight:800}.tarot:not(.turned) span{font-size:3rem;color:#ffe2a6}.tarot.turned{background:linear-gradient(145deg,#765a9a,#3a284e);transform:rotateY(360deg);font-size:.78rem}.tarot:disabled:not(.turned){opacity:.57}
.charmGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.charm{display:flex;align-items:center;flex-direction:column;gap:7px;min-height:139px;border:2px solid #795c94;border-radius:15px;background:#2c2046;color:var(--ink);padding:10px;box-shadow:inset 0 2px #ffffff13}.charm>span{font-size:2.2rem}.charm small{font-size:.76rem;line-height:1.2}.charm.selected{border-color:#8df7d4;background:#225757;box-shadow:0 0 22px #75f8dc4f}@keyframes orbPulse{50%{box-shadow:0 0 60px #ab76fb,inset 0 0 33px #f7d5ffad}}
/* MORSE SCORING WHEEL */
.morseSet{display:grid;place-items:center;margin:4px auto 10px}.wheelPointer{font-size:2rem;color:#ffe596;z-index:3;margin-bottom:-8px;filter:drop-shadow(0 0 8px #ffb36c)}
.morseWheel{--spin:0deg;position:relative;width:min(310px,79vw);aspect-ratio:1;border:12px double #f5bd7f;border-radius:50%;background:repeating-conic-gradient(from 0deg,#794f8e 0deg 45deg,#3a6481 45deg 90deg);box-shadow:0 0 0 7px #552b4c,0 20px 34px #170b1c;display:grid;place-items:center;transform:rotate(var(--spin))}
.morseWheel.spinning{animation:wheelSpin 2.05s cubic-bezier(.1,.7,.24,1) forwards}.wheelSpokes{position:absolute;inset:0}.wheelSpokes>span{position:absolute;top:11%;left:43%;font-size:1.45rem;transform-origin:25px 123px;transform:rotate(calc(var(--s)*45deg))}.morseWheel>b{font-size:4rem;color:#e9fffc;text-shadow:0 2px 10px #08030e;background:#24163799;border-radius:50%;padding:10px 22px;border:3px solid #fff4cd}
@keyframes wheelSpin{to{transform:rotate(var(--spin))}}.scoreMeter{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;margin:13px 0;border-radius:15px;border:2px solid #e8bf83;background:#211a3d}.scoreMeter>span{font-size:.8rem;font-weight:900;letter-spacing:.04em}.scoreMeter>strong{font-size:2.7rem;color:#9bf4d7}.scoreMeter>small{color:#f7c985;font-size:.69rem}

.moleMascot{font-size:3.8rem;line-height:1.3;text-align:center;margin:14px}.moleStatus{display:flex;justify-content:space-between;font-size:.83rem;color:#ffe3a3;font-weight:900}.moleBoard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:linear-gradient(#48506d,#372a4d);padding:12px;border:6px ridge #ba8463;border-radius:17px;margin:13px 0;min-height:365px}.moleHole{border-radius:50% 50% 18px 18px;position:relative;background:radial-gradient(ellipse at 50% 76%,#140d1d 15%,#31192e 65%,#5e364c 100%);min-height:107px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.holeGlow{opacity:.22;font-size:1.8rem}.mole{width:100%;height:112px;border:2px solid #f6b776;border-radius:40% 40% 13px 13px;background:linear-gradient(145deg,#a96560,#552b49);color:#fff8ed;font-weight:800;padding:6px;box-shadow:inset 0 4px #f6c5a451;animation:moleRise .38s ease-out both;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.moleFace{font-size:2rem;line-height:1}.moleText{font-size:.68rem;line-height:1.16;max-width:100%}.timeMeter{height:10px;border-radius:20px;background:#412a41;overflow:hidden;margin-top:9px}.timeMeter i{height:100%;display:block;width:100%;background:linear-gradient(90deg,#75ffdd,#ffd377,#ff6479)}@keyframes moleRise{from{transform:translateY(110%)}to{transform:translateY(0)}}
/* MIRRORS */
.mirrorField{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}.mirrorTile{height:120px;border:0;background:transparent;perspective:750px;padding:0}.mirrorInner{position:relative;display:block;width:100%;height:100%;transition:transform .48s;transform-style:preserve-3d}.mirrorTile.turned .mirrorInner,.mirrorTile.paired .mirrorInner{transform:rotateY(180deg)}.mirrorBack,.mirrorFront{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;backface-visibility:hidden;border-radius:18px 18px 27px 27px;border:4px ridge #e0b1a9;box-shadow:inset 0 0 19px #8ef9f666,0 9px 13px #12081e}
.mirrorBack{font-size:2.2rem;background:linear-gradient(135deg,#68547b,#284c64);color:#e5faff}.mirrorBack small{font-size:.52rem;letter-spacing:.12em}.mirrorFront{background:#f4e6e1;color:#281834;transform:rotateY(180deg);font-size:.76rem;font-weight:800;line-height:1.15;padding:8px;text-align:center}.mirrorTile.paired .mirrorFront{background:#c0f7e9;border-color:#69f5d0}

.carouselStage{position:relative;border:4px solid #d99e82;background:linear-gradient(#492951,#2e2147);padding:0 10px 16px;border-radius:18px;margin-top:15px;box-shadow:inset 0 0 30px #ecaf7250}.canopy{border-radius:0 0 45% 45%;border-bottom:7px dotted #ffdb89;background:repeating-linear-gradient(90deg,#e58a9e 0 34px,#fff1c4 34px 68px);text-align:center;color:#502641;font-weight:1000;padding:12px;font-size:.77rem;letter-spacing:.08em}
.horseRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}.horseSeat{position:relative;min-height:145px;display:flex;align-items:center;flex-direction:column;justify-content:flex-start;background:#2217337a;border:2px dashed #e4ad94;border-radius:12px;padding:5px}.horseSeat.ready{border-color:#a8ffe3;background:#28545680}.horse{font-size:2.7rem;animation:horseBop 1.8s ease-in-out infinite alternate}.horseSeat:nth-child(even) .horse{animation-delay:-.8s}.seatNum{font-size:.83rem;font-weight:1000;color:#ffe29d}.horseSeat small{font-size:.64rem;line-height:1.15;text-align:center;margin-top:5px}.actionTokens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.actionToken{min-height:67px;padding:10px;border:2px solid #b89dce;border-radius:12px;background:#4a3156;color:var(--ink);font-size:.8rem;font-weight:700}.actionToken:disabled{opacity:.38}.actionToken:not(:disabled):hover{border-color:#8cf7da}@keyframes horseBop{to{transform:translateY(10px)}}
@media(max-width:590px){.ringArena{min-height:340px;padding:37px 6px 12px}.bottleStand{height:168px}.bottleIcon{font-size:2rem}.bottleLabel{font-size:.59rem}.balloonField{min-height:350px;gap:6px;padding:12px 5px 27px}.balloon{height:142px}.balloonSkin{height:118px;font-size:.64rem;padding:7px}.tarot{min-height:125px;padding:7px;font-size:.67rem}.charm{min-height:132px;padding:7px}.charm small{font-size:.67rem}.morseFields{grid-template-columns:1fr}.moleBoard{min-height:350px;gap:6px;padding:7px}.moleHole{min-height:105px}.mole{height:108px;padding:3px}.moleText{font-size:.60rem}.mirrorField{grid-template-columns:repeat(3,minmax(0,1fr))}.mirrorTile{height:114px}.mirrorFront{font-size:.70rem}.horseRow{gap:4px}.horse{font-size:2rem}.horseSeat{min-height:148px}.horseSeat small{font-size:.59rem}.actionToken{font-size:.75rem}}

{id:'toss',name:'Ghoulish Ring Toss',icon:'⭕',topic:'Mobility equipment',desc:'Drag a glowing ring onto the right transfer rig. No multiple-choice buttons.',type:'ring',from:'#68304f',border:'#ffa2ba',tickets:'Up to 700+',kicker:'SKILL + SAFETY · PHYSICAL AIM'},

{id:'fortune',name:'Madame Cortex',icon:'🔮',topic:'Acute cognition + dementia plans',desc:'Reveal secret tarot clues and assemble a three-charm care plan.',type:'fortune',from:'#45306f',border:'#c0a0ff',tickets:'Up to 600+',kicker:'INVESTIGATE · DEDUCE · CAST'},

{case:'After ankle surgery, a patient has strict non-weight-bearing orders on one leg. Trunk control and arm strength are good; the patient can scoot sideways while seated.',options:[['step','Step-pivot with belt','🚶'],['board','Assisted slide board','🛹'],['stand','Powered sit-to-stand','♿'],['lift','Full-body sling lift','🏗️']],correct:'board',why:'A supervised slide board allows lateral seated movement while maintaining non-weight-bearing restrictions.'},

{prompt:'Pop the findings that warrant an URGENT response to postoperative wound complications.',why:'Evisceration, new uncontrolled bleeding, and systemic instability require immediate protection, help and escalation.',items:[

{title:'The sudden night visitor',story:'An 81-year-old with established Alzheimer disease becomes inattentive and newly disoriented within hours. Their daughter says this is a sharp departure from baseline.',clues:['New fluctuation over hours, not months','Recent oxybutynin dose increase','Urinary urgency and a low-grade fever'],task:'Choose THREE actions for the initial nursing plan.',charms:[['vitals','Check vital signs, oxygenation, and bedside glucose as indicated',true],['baseline','Clarify baseline and recent medication changes with family',true],['workup','Escalate for prompt evaluation of potentially reversible causes',true],['months','Schedule a routine memory test in one month',false],['restraint','Restrain the patient before any assessment',false],['expected','Document the confusion as inevitable dementia progression',false]],why:'Acute attention changes suggest delirium superimposed on dementia. Preserve safety and assess physiologic causes, medication changes, and infection or urinary concerns promptly.'},
{title:'The river of missing steps',story:'A 71-year-old has a history of lacunar strokes, hypertension, uncontrolled diabetes and a decline in executive function that the family describes as stepwise.',clues:['Symptoms worsened after discrete vascular events','Several modifiable cardiovascular risks remain','The family asks what could reduce further injury'],task:'Choose THREE practical vascular-risk priorities.',charms:[['bp','Coordinate blood-pressure management',true],['glucose','Support diabetes management and follow-up',true],['stroke','Reinforce stroke prevention and prescribed vascular care',true],['memory','Promise that memory games reverse existing infarcts',false],['sedation','Use routine sedatives to prevent future strokes',false],['ignore','Ignore vascular risks once cognitive decline has begun',false]],why:'Vascular cognitive impairment warrants careful risk reduction and interdisciplinary follow-up; neither sedatives nor memory games repair damaged cerebral vessels.'},
{title:'The mask in the mirror',story:'A patient has fluctuating alertness, well-formed visual hallucinations and a shuffling gait. They are frightened by a figure they see in the room.',clues:['Hallucinations are vivid and recurrent','Motor changes resemble parkinsonism','Distress rises when staff argue about what is real'],task:'Choose THREE nonpharmacologic or collaborative responses.',charms:[['safety','Check safety and assess immediate triggers or unmet needs',true],['calm','Respond calmly without arguing about the hallucination',true],['meds','Collaborate on medication review and clinical evaluation',true],['debate','Insist the figure is imaginary until the patient agrees',false],['restrain','Apply restraints for all hallucinations',false],['block','Remove glasses and isolate the patient to reduce stimulation',false]],why:'This pattern raises concern for Lewy body disease. Prioritize safety, comfort, low-conflict communication and medication review; some antipsychotics can cause severe sensitivity.'}

{t:'Use a bath thermometer before washing numb feet.',safe:true,why:'An objective temperature check reduces burn risk when sensation is reduced.'},

// RING TOSS: physical pointer drag + fallback target taps, each peg is a real rendered object.
function bottle(i,opt){return `<button class="bottleStand" data-ring-target="${i}" aria-label="Toss ring onto ${esc(opt[1])}"><span class="bottleIcon">${opt[2]}</span><span class="bottleNeck"></span><span class="bottleLabel">${esc(opt[1])}</span><span class="targetHalo"></span></button>`}
function renderRing(b){const a=active,q=RINGS[a.stage];if(!q)return finishBooth();const options=stageLayout('ringOptions',q.options);open(shell(b,`<div class="kicker">RING ${a.stage+1} OF ${RINGS.length} · READ THE PATIENT</div><div class="arcadeCase">${esc(q.case)}</div><p class="tiny">DRAG the glowing ring from the launch pad onto a transfer rig. On mobile, you can also TAP the rig to throw. Aiming and clinical judgment both count.</p><div class="ringArena" id="ringArena"><div class="marqueeMini">⚑ PICK THE SAFEST RIG ⚑</div><div class="bottleShelf">${options.map((o,i)=>bottle(i,o)).join('')}</div><div class="ringLaunch"><span class="ringProjectile" id="ringProjectile" role="img" aria-label="Glowing ring to drag">◎</span><span class="launchPlaque">DRAG TO TOSS</span></div></div><div class="arcadeFooter">Thrown: ${a.stage} / ${RINGS.length} · 🎪 The rigs reshuffle for each patient</div>`));const node=$('ringProjectile');node.addEventListener('pointerdown',ev=>{ev.preventDefault();ringDrag={id:ev.pointerId,x:ev.clientX,y:ev.clientY};node.setPointerCapture(ev.pointerId);node.classList.add('dragging')});node.addEventListener('pointermove',ev=>{if(!ringDrag||ringDrag.id!==ev.pointerId)return;ev.preventDefault();node.style.transform=`translate(${ev.clientX-ringDrag.x}px,${ev.clientY-ringDrag.y}px) scale(1.12)`});node.addEventListener('pointerup',ev=>{if(!ringDrag)return;const targets=[...document.querySelectorAll('.bottleStand')],dist=targets.map((t,i)=>{const r=t.getBoundingClientRect();return {i,d:Math.hypot(ev.clientX-(r.left+r.width/2),ev.clientY-(r.top+r.height/2))}}).sort((a,b)=>a.d-b.d);ringDrag=null;node.classList.remove('dragging');if(dist[0]?.d<110)ringThrow(dist[0].i);else{node.style.transform='';toast('⭕ Ring missed the peg! Aim higher and try again.')}})}
function ringThrow(i){const a=active;if(!a||a.id!=='toss'||a.phase!=='play')return;const q=RINGS[a.stage],opt=stageLayout('ringOptions',q.options)[i];a.phase='animating';const p=$('ringProjectile'),t=document.querySelector(`[data-ring-target="${i}"]`);if(p&&t){const r=t.getBoundingClientRect(),o=p.getBoundingClientRect();p.style.transition='transform .48s cubic-bezier(.16,.9,.44,1)';p.style.transform=`translate(${r.left+r.width/2-o.left-o.width/2}px,${r.top+r.height/2-o.top-o.height/2-5}px) scale(.6) rotate(540deg)`;t.classList.add('landing')}arcadeTimer=setTimeout(()=>{if(!active||active!==a)return;const ok=opt[0]===q.correct;gradeCase({question:q.case,yours:opt[1],answer:q.options.find(o=>o[0]===q.correct)[1],ok,why:q.why,rewardGood:125,rewardBad:15,extra:`YOUR RING LANDED: ${opt[1]}`})},530)}
// BALLOONS: animated floating targets; pop all matching balloons per wave.
function renderBalloons(b){const a=active,q=BALLOONS[a.stage];if(!q)return finishBooth();const items=stageLayout('balloonItems',q.items);const correctIds=items.map((x,i)=>x[1]?i:-1).filter(i=>i>=0);open(shell(b,`<div class="kicker">WAVE ${a.stage+1}/${BALLOONS.length} · CLINICAL BALLOON HUNT</div><div class="arcadeCase">${esc(q.prompt)}</div><p class="tiny">Pop only matching balloons. Wrong balloons deduct potential winnings. Every balloon is a brief assessment clue; each wave has a fresh layout.</p><div class="balloonField">${items.map(([label],i)=>`<button class="balloon ${a.popped.includes(i)?'popped':''}" data-balloon="${i}" style="--i:${i};--hue:${[335,180,42,275,5,150][i]}"><span class="balloonSkin">${a.popped.includes(i)?'✹':esc(label)}</span><span class="balloonString"></span></button>`).join('')}</div><div class="arcadeFooter">🎈 Correct balloons popped: ${a.popped.filter(i=>items[i][1]).length}/${correctIds.length} · Mistakes: ${a.errors||0}</div>`))}
function balloonPop(i){const a=active;if(!a||a.id!=='pop'||a.phase!=='play'||a.popped.includes(i))return;const q=BALLOONS[a.stage],items=stageLayout('balloonItems',q.items),good=items[i][1];if(!items[i])return;a.popped.push(i);const reward=good?45:5;earnInBooth(reward);a.asked++;if(good)a.correct++;else a.errors=(a.errors||0)+1;addHistory(a.id,q.prompt,items[i][0],items.filter(x=>x[1]).map(x=>x[0]).join(' | '),good,q.why);sound(good?'good':'bad');const target=document.querySelector(`[data-balloon="${i}"]`);if(target){target.classList.add('exploding');target.disabled=true}const done=items.every((o,j)=>!o[1]||a.popped.includes(j));arcadeTimer=setTimeout(()=>{if(!active||active!==a)return;if(done){a.last={ok:!(a.errors||0),title:!(a.errors||0)?'PERFECT POP!':'WAVE COMPLETE',explanation:q.why,extra:'All target balloons were found.',reward:a.popped.filter(j=>items[j][1]).length*45+(a.errors||0)*5};a.phase='feedback';save();renderActive()}else renderActive()},350)}
// FORTUNE TELLER: reveal three physical tarot cards and choose three clinical charms.
function renderFortune(b){const a=active,q=FORTUNES[a.stage];if(!q)return finishBooth();const charms=stageLayout('charmOptions',q.charms);open(shell(b,`<div class="kicker">READING ${a.stage+1}/${FORTUNES.length} · ${esc(q.title)}</div><div class="arcadeCase">${esc(q.story)}</div><div class="crystalScene"><div class="crystalOrb" aria-hidden="true">✶<small>☽</small></div><div class="tarotRow">${q.clues.map((cl,i)=>`<button class="tarot ${a.clues>i?'turned':''}" data-tarot="${i}" ${a.clues<i?'disabled':''}><span>${a.clues>i?esc(cl):'✦'}</span></button>`).join('')}</div></div><p class="tiny">Reveal each card from left to right. Then select exactly three care-plan charms. Their positions change each reading.</p>${a.clues===3?`<h3 class="arcadeSub">${esc(q.task)}</h3><div class="charmGrid">${charms.map(([id,label],i)=>`<button class="charm ${a.selected.includes(i)?'selected':''}" data-charm="${i}"><span>${['🗝️','🌿','⚗️','🕯️','🩸','📜'][i]}</span><small>${esc(label)}</small></button>`).join('')}</div><div class="rowBtns"><button class="btn mint" data-game="cast" ${a.selected.length!==3?'disabled':''}>🔮 Cast the care plan (${a.selected.length}/3)</button></div>`:'<p class="notice">🔮 The oracle is waiting. Tap the next face-down tarot card to reveal a clue.</p>'}`))}
function revealTarot(i){if(!active||active.id!=='fortune'||active.phase!=='play'||active.clues!==i)return;active.clues++;sound('bonus');renderActive()}
function selectCharm(i){const a=active;if(!a||a.id!=='fortune'||a.clues<3)return;a.selected=a.selected.includes(i)?a.selected.filter(x=>x!==i):a.selected.length<3?[...a.selected,i]:a.selected;renderActive()}
function castFortune(){const a=active;if(!a||a.id!=='fortune'||a.selected.length!==3)return;const q=FORTUNES[a.stage],charms=stageLayout('charmOptions',q.charms);const hits=a.selected.filter(i=>charms[i][2]).length,ok=hits===3;const selected=a.selected.map(i=>charms[i][1]).join(' | '),target=charms.filter(x=>x[2]).map(x=>x[1]).join(' | ');let award=hits*42+(ok?65:8);earnInBooth(award);a.asked+=3;a.correct+=hits;addHistory(a.id,q.story,selected,target,ok,q.why);a.last={ok,title:`${hits}/3 SAFE CHARMS`,explanation:q.why,extra:'Recommended charms: '+target,reward:award};a.phase='feedback';sound(ok?'good':'bad');save();renderActive()}
// MORSE WHEEL: a physical spin animation, six adjustable scoring dials and computed score.
function renderMorse(b){const a=active,q=MORSE[a.stage];if(!q)return finishBooth();let wheel=`<div class="morseWheel ${a.spinning?'spinning':''}" style="--spin:${a.rotation||0}deg"><div class="wheelSpokes">${['🎟','🦇','✨','🎪','🩺','🌙','💀','🎡'].map((x,i)=>`<span style="--s:${i}">${x}</span>`).join('')}</div><b>13</b></div>`;
if(!a.spun){open(shell(b,`<div class="kicker">PATIENT ${a.stage+1}/${MORSE.length}</div><div class="morseSet"><div class="wheelPointer">▼</div>${wheel}</div><p class="arcadeSub">Spin the wheel to reveal the patient's chart and score it.</p><div class="rowBtns"><button class="btn mint" data-game="spin" ${a.spinning?'disabled':''}>🎡 SPIN THE WHEEL!</button></div>`));return}
const inputs=a.entries||{},filled=Object.keys(inputs).length;const dials=a.morseDials||(a.morseDials=MORSE_FIELDS.map(f=>shuffle(f.values)));
open(shell(b,`<div class="kicker">PATIENT ${a.stage+1}/${MORSE.length} · SIX SCORING DIALS</div><div class="arcadeCase">${esc(q.case)}</div><div class="scoreMeter"><span>YOUR MORSE TOTAL</span><strong>${Object.values(inputs).reduce((n,x)=>n+x,0)}</strong><small>Points selected: ${filled}/6</small></div><div class="morseFields">${MORSE_FIELDS.map((f,i)=>`<div class="morseField"><b>${i+1}. ${esc(f.label)}</b><div class="dialButtons">${dials[i].map(([v,label])=>`<button class="dial ${inputs[i]===v?'selected':''}" data-morse="${i}" data-points="${v}">${esc(label)} <em>+${v}</em></button>`).join('')}</div></div>`).join('')}</div><div class="rowBtns"><button class="btn mint" data-game="score" ${filled!==6?'disabled':''}>🎟️ CASH OUT SCORE</button></div>`))}
function spinMorse(){const a=active;if(!a||a.id!=='wheel'||a.spun||a.spinning)return;a.spinning=true;a.rotation=1440+(a.stage+1)*162;renderActive();arcadeTimer=setTimeout(()=>{if(!active||active!==a)return;a.spinning=false;a.spun=true;a.entries={};renderActive();sound('bonus')},2100)}
function setMorse(i,p){if(!active||active.id!=='wheel'||!active.spun)return;active.entries[i]=p;renderActive()}
function gradeMorse(){const a=active;if(!a||a.id!=='wheel'||!a.spun||Object.keys(a.entries).length!==6)return;const q=MORSE[a.stage],got=MORSE_FIELDS.reduce((n,_,i)=>n+a.entries[i],0),correct=q.values.reduce((x,y)=>x+y,0);gradeCase({question:q.case,yours:String(got)+' (categories: '+Object.values(a.entries).join(',')+')',answer:String(correct),ok:got===correct&&q.values.every((v,i)=>v===a.entries[i]),why:q.why,rewardGood:155,rewardBad:25,extra:`YOUR SCORE ${got} / CORRECT SCORE ${correct}`})}
// MOLE ARCADE: timed 3x3 board, unsafe = whack; safe = let it leave. All statements are new.
function renderWhackArcade(b){const a=active;if(a.stage>=a.pool.length)return finishBooth();if(a.phase==='intro'){open(shell(b,`<div class="moleMascot">🧟🔨</div><div class="arcadeCase">Whack UNSAFE nursing actions. Let SAFE actions pass without tapping them. Each mole disappears after seven seconds.</div><p class="tiny">Twelve moving targets. A correct whack or decision to wait earns tickets. Select a pace; both earn the same clinical rewards.</p><div class="rowBtns"><button class="btn mint" data-game="moleStart" data-speed="chill">🐢 Study pace · 13s</button><button class="btn pink" data-game="moleStart" data-speed="arcade">⚡ Arcade pace · 7s</button></div>`));return}
const q=a.pool[a.stage];const hole=a.hole??Math.floor(Math.random()*9);a.hole=hole;open(shell(b,`<div class="kicker">MOLE ${a.stage+1}/12 · WHACK UNSAFE / SPARE SAFE</div><div class="moleStatus"><span>🔨 ${a.correct} hits</span><span id="moleClock">${(a.whackSecs||7).toFixed(1)} seconds</span></div><div class="moleBoard">${Array.from({length:9},(_,i)=>`<div class="moleHole">${i===hole?`<button class="mole up" data-game="whack" aria-label="Whack the mole"><span class="moleFace">👹</span><span class="moleText">${esc(q.t)}</span></button>`:'<span class="holeGlow">✦</span>'}</div>`).join('')}</div><div class="timeMeter"><i id="moleTimeBar"></i></div><p class="tiny">If this action is safe, don't touch the mole—let it disappear.</p>`));let left=(a.whackSecs||7)*4,total=left;arcadeTick=setInterval(()=>{left--;if($('moleClock'))$('moleClock').textContent=(left/4).toFixed(1)+' seconds';if($('moleTimeBar'))$('moleTimeBar').style.width=(left/total*100)+'%';if(left<=0)judgeWhack(false)},250)}
function judgeWhack(whacked){const a=active;if(!a||a.id!=='whack'||a.phase!=='play')return;stopArcade();const q=a.pool[a.stage],ok=whacked?!q.safe:q.safe;const reward=ok?42:5;earnInBooth(reward);a.asked++;if(ok)a.correct++;addHistory(a.id,q.t,whacked?'WHACK':'LET PASS',q.safe?'LET PASS':'WHACK',ok,q.why);a.phase='brief';sound(ok?'good':'bad');open(shell(BOOTHS.find(x=>x.id==='whack'),`<div class="moleMascot">${ok?'🎯':'💀'}</div><h3>${ok?'HAZARD HANDLED!':'THE MOLE ESCAPES!'}</h3><div class="arcadeCase">${esc(q.t)}</div><div class="feedback ${ok?'good':'bad'}"><b>${q.safe?'SAFE ACTION':'UNSAFE ACTION'}</b><p>${esc(q.why)}</p><div class="ticketBurst">+${reward} 🎟</div></div><p class="tiny">Next target appears automatically…</p>`));arcadeTimer=setTimeout(()=>{if(active!==a)return;a.stage++;a.hole=Math.floor(Math.random()*9);a.phase='play';if(a.stage>=12)finishBooth();else renderActive()},1150)}
// MEMORY MIRROR: real matching with physical card-flip and win bonus.
function renderMirrors(b){const a=active;if(a.matched.length===6)return finishBooth();open(shell(b,`<div class="kicker">THE MIRROR MAZE · MATCH SIX PAIRS</div><div class="arcadeCase">Match each clinical finding with its interpretation. The mirrors remember every wrong guess.</div><div class="medals"><span class="medal">🪞 ${a.matched.length}/6 pairs</span><span class="medal">🎯 ${a.moves} tries</span></div><div class="mirrorField">${a.deck.map((c,i)=>{const on=a.revealed.includes(i)||a.matched.includes(c.pid);return `<button class="mirrorTile ${on?'turned':''} ${a.matched.includes(c.pid)?'paired':''}" data-mirror="${i}" ${a.matched.includes(c.pid)||a.busy?'disabled':''}><span class="mirrorInner"><span class="mirrorBack">✧<small>WARD 13</small></span><span class="mirrorFront">${esc(c.label)}</span></span></button>`}).join('')}</div><p class="tiny">Pairing a finding with its meaning earns tickets. The fewer flips, the larger the bonus.</p><div class="rowBtns"><button class="btn secondary" data-game="reshuffle">Reshuffle the mirrors</button></div>`))}
function flipMirror(i){const a=active;if(!a||a.id!=='mirror'||a.busy||a.revealed.includes(i)||a.matched.includes(a.deck[i]?.pid))return;a.revealed.push(i);renderActive();if(a.revealed.length!==2)return;a.moves++;const [x,y]=a.revealed;const same=a.deck[x].pid===a.deck[y].pid;if(same){a.matched.push(a.deck[x].pid);a.correct++;a.asked++;earnInBooth(45);addHistory(a.id,a.deck[x].label,a.deck[y].label,a.deck[y].label,true,'Paired clinical cue and interpretation.');sound('good');a.revealed=[];arcadeTimer=setTimeout(()=>{if(active!==a)return;if(a.matched.length===6){earnInBooth(Math.max(30,200-(a.moves-6)*16));finishBooth()}else renderActive()},400)}else{a.busy=true;const nonce=a.nonce;arcadeTimer=setTimeout(()=>{if(!active||active.nonce!==nonce)return;a.revealed=[];a.busy=false;renderActive()},1050)}}
function reshuffleMirrors(){const a=active;if(!a||a.id!=='mirror')return;a.nonce=Date.now()+Math.random();a.deck=shuffle(a.deck);a.revealed=[];a.matched=[];a.moves=0;a.busy=false;a.correct=0;a.asked=0;renderActive()}
// CAROUSEL: build an ordered 4-horse ride; physical horses show the placed action.
function renderCarousel(b){const a=active,q=CAROUSELS[a.stage];if(!q)return finishBooth();open(shell(b,`<div class="kicker">CAROUSEL ${a.stage+1}/${CAROUSELS.length} · ${esc(q.title)}</div><div class="arcadeCase">${esc(q.case)}</div><div class="carouselStage"><div class="canopy">✦ 🎪 HAUNTED CAROUSEL ✦</div><div class="horseRow">${Array.from({length:4},(_,i)=>`<div class="horseSeat ${a.selected[i]!==undefined?'ready':''}"><span class="horse">🎠</span><span class="seatNum">${i+1}</span><small>${a.selected[i]!==undefined?esc(q.steps[a.selected[i]]):'EMPTY SEAT'}</small></div>`).join('')}</div></div><p class="tiny">Tap the step cards in the order you want the horses to carry out care. You can undo before checking.</p><div class="actionTokens">${a.seqOrder.map(i=>`<button class="actionToken" data-step="${i}" ${a.selected.includes(i)?'disabled':''}>${esc(q.steps[i])}</button>`).join('')}</div>${a.attempts?`<div class="notice">The ride bucked on the last attempt. Reorder the actions and try again. Attempts: ${a.attempts}</div>`:''}<div class="rowBtns"><button class="btn secondary" data-game="undo">↶ Undo</button><button class="btn mint" data-game="checkCarousel" ${a.selected.length!==4?'disabled':''}>🎠 START THE RIDE</button></div>`))}
function chooseCarousel(i){const a=active;if(!a||a.id!=='carousel'||a.selected.includes(i)||a.selected.length>=4)return;a.selected.push(i);renderActive()}
function checkCarousel(){const a=active;if(!a||a.id!=='carousel'||a.selected.length!==4)return;const q=CAROUSELS[a.stage],ok=a.selected.join(',')==='0,1,2,3';if(ok){const reward=Math.max(50,170-a.attempts*35);gradeCase({question:q.case,yours:a.selected.map(i=>q.steps[i]).join(' → '),answer:q.steps.join(' → '),ok:true,why:q.why,rewardGood:reward,extra:'THE HAUNTED HORSES ARE MOVING AGAIN.'})}else{a.attempts++;addHistory(a.id,q.case,a.selected.map(i=>q.steps[i]).join(' → '),q.steps.join(' → '),false,q.why);a.asked++;a.selected=[];a.seqOrder=shuffle([0,1,2,3]);toast('🎠 The ride bucked! Rebuild the clinical order.');sound('bad');renderActive()}}
function finishBooth(){if(!active)return;stopArcade();const a=active,b=BOOTHS.find(x=>x.id===a.id),first=!state.boothFirst.includes(a.id);if(first){state.boothFirst.push(a.id);earnInBooth(85)}state.stats[a.id]??={plays:0,correct:0,asked:0,best:0};state.stats[a.id].plays++;state.stats[a.id].correct+=a.correct;state.stats[a.id].asked+=a.asked;state.stats[a.id].best=Math.max(state.stats[a.id].best,a.correct);state.earnedByBooth[a.id]=(state.earnedByBooth[a.id]||0)+a.earned;save();const score=a.asked?Math.round(a.correct/a.asked*100):100;active=null;open(`<div class="modalKicker">🎪 SIDESHOW CLEARED · ${esc(b.name)}</div><h2>${first?'FIRST CLEAR STAMP UNLOCKED!':'YOU SURVIVED ANOTHER SHIFT'}</h2><div class="parade">${b.icon} 🎟️ ${b.icon}</div><div class="ticketBurst">+${fmt(a.earned)} tickets</div><div class="medals"><span class="medal">Clinical hits ${a.correct}/${a.asked}</span><span class="medal">Accuracy ${score}%</span>${first?'<span class="medal">First clear +85 tickets</span>':''}</div><p>${first?'Another attraction has been stamped on your carnival passport.':'Come back anytime to sharpen your skill and keep earning tickets.'}</p><div class="rowBtns"><button class="btn mint" data-action="close">🎪 More midway games</button><button class="btn pink" data-action="shopAfter">🎁 Redeem tickets</button></div>`);sound('bonus')}

function pendingBonus(){return [2,4,6].find(n=>state.boothFirst.length>=n&&!state.bonuses.includes(n))}
function showPendingBonus(){const n=pendingBonus();if(!n)return;open(`<div class="modalKicker">🎟️ THE GOLDEN TICKET CURSE · MILESTONE ${n}/7</div><h2>N.U.R.S.E. found three sealed parcels.</h2><p>Choose one. Each parcel contains a different pile of bonus tickets. No wrong answers, but suspiciously enthusiastic customer service.</p><div class="giftBoxes">${[0,1,2].map(i=>`<button class="gift" data-bonus="${i}">🎁<small>BOX ${i+1}</small></button>`).join('')}</div>`)}
function chooseBonus(idx){const n=pendingBonus();if(!n)return;const amounts=shuffle(n===2?[70,110,150]:n===4?[120,170,230]:[170,250,330]);const value=amounts[idx];earn(value);state.bonuses.push(n);save();open(`<div class="modalKicker">BONUS PARCEL OPENED</div><h2>🎉 No refunds. No hauntings returned.</h2><div class="ticketBurst">+${fmt(value)} 🎟</div><p style="text-align:center">Bonus milestone ${n}/7 claimed! The other two parcels dissolve into ectoplasm.</p><div class="rowBtns"><button class="btn mint" data-action="close">Back to the midway</button><button class="btn secondary" data-action="shopAfter">Browse the curios</button></div>`);sound('good')}
function parade(){const all=BOOTHS.every(b=>state.boothFirst.includes(b.id));if(!all){open(`<div class="modalKicker">GRAND PARADE · RESTRICTED</div><h2>Seven booths. One very dramatic finale.</h2><div class="parade">🎪🎠🎡</div><p>Clear all seven unique carnival booths to unlock a secret gallery collectible and 350 extra tickets.</p><div class="medals">${BOOTHS.map(b=>`<span class="medal">${b.icon} ${state.boothFirst.includes(b.id)?'✓':'🔒'} ${esc(b.name)}</span>`).join('')}</div><div class="rowBtns"><button class="btn mint" data-action="close">Back to the booths</button></div>`);return}if(!state.parade){state.parade=true;state.owned.push('parade');earn(350);save()}open(`<div class="modalKicker">THE MIDNIGHT MIDWAY · GRAND FINALE</div><h2>🎉 The parade is yours!</h2><div class="parade">🎠 👑 🎪 🎟️</div><div class="ticketBurst">+350 🎟</div><p style="text-align:center">You've earned the <b>Midway Master Relic</b> for your study gallery. N.U.R.S.E. has reluctantly filed a commendation.</p><div class="rowBtns"><button class="btn mint" data-action="galleryAfter">See your mythical collectible →</button><button class="btn secondary" data-action="close">Return to the midway</button></div>`);sound('good')}
function prizeDetail(id){const p=PRIZES.find(x=>x.id===id);if(!p)return;const own=state.owned.includes(id),fav=state.favorites.includes(id);const note=state.notes[id]||'';const price=p.price;open(`<div class="modalKicker">${esc(p.rarity)} · ${esc(p.topic)} · ${own?'ON YOUR SHELF':'AT THE PRIZE COUNTER'}</div><h2>${esc(p.name)}</h2>${art(p,!own)}<p style="text-align:center">${esc(p.desc)}</p>${own?`<div class="callout"><b>📚 CLINICAL PEARL</b><p>${esc(p.pearl)}</p></div><label class="tiny" for="note">MY STUDY MEMORY HOOK / NOTES</label><textarea class="field" id="note" placeholder="Write a quick mnemonic or clinical reminder…">${esc(note)}</textarea><div class="rowBtns"><button class="btn mint" data-save-note="${id}">💾 Save my note</button><button class="btn secondary" data-fav="${id}">${fav?'★ Unfavorite':'☆ Add to favorites'}</button></div>`:`<div class="callout">🔒 Its clinical pearl is hidden until you collect it. ${price==null?(p.realm?'Earn this relic by defeating the False-Signal Dragon.':'Unlock this relic by clearing all seven booths.'):'Cost: 🎟 '+fmt(price)+(p.unlock&&!realmUnlocked(p)?' · Complete the required fantasy quest first.':' · You have '+fmt(state.tickets)+' tickets.')}</div><div class="rowBtns"><button class="btn pink" data-buy="${id}" ${price==null||state.tickets<price||!realmUnlocked(p)?'disabled':''}>🎁 ${price==null?'Grand Parade exclusive':state.tickets>=price?'Redeem for '+fmt(price)+' tickets':'Need '+fmt(Math.max(0,price-state.tickets))+' more tickets'}</button></div>`}<div class="rowBtns"><button class="btn secondary" data-action="close">Close</button></div>`)}
function buy(id){const p=PRIZES.find(x=>x.id===id);if(!p||p.price==null||state.owned.includes(id)||state.tickets<p.price||!realmUnlocked(p))return;state.tickets-=p.price;state.owned.push(id);save();sound('good');prizeDetail(id);toast('🎁 '+p.name+' added to your study gallery!')}
function noteSave(id){if(!state.owned.includes(id))return;state.notes[id]=$('note')?.value.slice(0,1500)||'';save();toast('📚 Study note saved to this collectible!')}
function toggleFav(id){if(!state.owned.includes(id))return;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();prizeDetail(id)}
function reportText(){const l=['WARD 13 — MIDNIGHT MIDWAY STUDY REPORT','Clinical answers: '+state.totalCorrect+'/'+state.totalAsked+' ('+(state.totalAsked?Math.round(state.totalCorrect/state.totalAsked*100):0)+'%)','Booths cleared: '+state.boothFirst.length+'/7','Tickets currently available: '+fmt(state.tickets),'Tickets earned lifetime: '+fmt(state.lifetime),'Collectibles: '+state.owned.map(id=>PRIZES.find(p=>p.id===id)?.name||id).join(', '),'','BOOTH RESULTS'];BOOTHS.forEach(b=>{const x=state.stats[b.id]||{correct:0,asked:0,plays:0};l.push(b.name+': '+x.correct+'/'+x.asked+' correct; '+x.plays+' plays')});l.push('','RECENT MISSES');state.history.filter(x=>!x.correct).slice(-40).forEach(x=>l.push(x.booth+': '+x.question+'\nMy answer: '+x.yours+'\nCorrect: '+x.answer+'\nRationale: '+x.why,'---'));return l.join('\n')}
function share(which){const backup=which==='backup',value=backup?JSON.stringify(state):reportText();open(`<div class="modalKicker">${backup?'SAVE TRANSFER':'STUDY RESULTS EXPORT'}</div><h2>${backup?'Backup your haunted collection 💾':'Share your performance 📤'}</h2><p>${backup?'Copy this backup to your notes or another device. Restore it on this same game page using Results → Restore Save.':'Copy this text into ChatGPT. It includes your accuracy, prizes, and missed questions.'}</p><textarea id="exportBox" class="field" readonly style="min-height:230px" aria-label="${backup?'Backup text':'Results report'}"></textarea><div class="rowBtns"><button class="btn mint" data-action="copyExport">📋 Copy ${backup?'backup':'results'}</button><button class="btn secondary" data-action="close">Close</button></div><p class="caption">If Copy is blocked on iPhone, tap and hold the text, choose Select All, and then Copy.</p>`);$('exportBox').value=value}
function restore(){open(`<div class="modalKicker">RESTORE YOUR CARNIVAL COLLECTION</div><h2>📥 Unseal the old ticket ledger</h2><p>Paste a prior backup from this game. Restoring replaces your current tickets, gallery, and study records in this browser.</p><textarea id="restoreBox" class="field" style="min-height:170px" placeholder="Paste your saved game data here…"></textarea><div class="rowBtns"><button class="btn pink" data-action="doRestore">Restore this backup</button><button class="btn secondary" data-action="close">Cancel</button></div>`)}
function doRestore(){try{const s=JSON.parse($('restoreBox').value);if(s.version!==1||!Array.isArray(s.owned)||!Array.isArray(s.boothFirst)||!Array.isArray(s.history)||typeof s.tickets!=='number'||!Number.isFinite(s.tickets)||s.tickets<0)throw new Error('Incompatible or invalid backup');if(!confirm('Replace the current carnival save with this backup?'))return;state={...stateDefaults(),...s};save();close();toast('🎟️ Carnival save restored successfully!')}catch(e){toast('That backup could not be read. Check the copied text and try again.')}}
async function copyExport(){let value=$('exportBox').value;try{await navigator.clipboard.writeText(value);toast('Copied! Paste it into ChatGPT or a safe note.')}catch(e){$('exportBox').focus();$('exportBox').select();toast('Select the text and use Copy.')}}
function playAgain(){view='midway';close();document.getElementById('booths')?.scrollIntoView({block:'start',behavior:'smooth'})}
$('app').addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;const d=el.dataset;
if(d.nav){view=d.nav;close();window.scrollTo({top:0,behavior:'smooth'});return}
if(d.play){startBooth(d.play);return}
if(d.hero==='play'){document.getElementById('booths')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(d.ringTarget!==undefined){ringThrow(Number(d.ringTarget));return}
if(d.balloon!==undefined){balloonPop(Number(d.balloon));return}
if(d.tarot!==undefined){revealTarot(Number(d.tarot));return}
if(d.charm!==undefined){selectCharm(Number(d.charm));return}
if(d.morse!==undefined){setMorse(Number(d.morse),Number(d.points));return}
if(d.mirror!==undefined){flipMirror(Number(d.mirror));return}
if(d.step!==undefined){chooseCarousel(Number(d.step));return}
if(d.game==='next'){nextStage();return}
if(d.game==='cast'){castFortune();return}
if(d.game==='spin'){spinMorse();return}
if(d.game==='score'){gradeMorse();return}
if(d.game==='moleStart'){active.whackSecs=d.speed==='chill'?13:7;active.phase='play';active.stage=0;active.hole=Math.floor(Math.random()*9);renderActive();return}
if(d.game==='whack'){judgeWhack(true);return}
if(d.game==='reshuffle'){reshuffleMirrors();return}
if(d.game==='undo'){active?.selected.pop();renderActive();return}
if(d.game==='checkCarousel'){checkCarousel();return}
if(d.bonus!==undefined){chooseBonus(Number(d.bonus));return}
if(d.prize){prizeDetail(d.prize);return}
if(d.buy){buy(d.buy);return}
if(d.saveNote){noteSave(d.saveNote);return}
if(d.fav){toggleFav(d.fav);return}
if(d.filter){galleryFilter=d.filter;renderGallery();return}
if(d.action==='close'){close();return}
if(d.action==='shopAfter'){view='shop';close();window.scrollTo(0,0);return}
if(d.action==='galleryAfter'){view='gallery';galleryFilter='owned';close();window.scrollTo(0,0);return}
if(d.action==='parade'){parade();return}
if(d.action==='sound'){sfx=!sfx;render();if(sfx)sound('bonus');return}
if(d.action==='share'){share('report');return}
if(d.action==='backup'){share('backup');return}
if(d.action==='restore'){restore();return}
if(d.action==='doRestore'){doRestore();return}
if(d.action==='copyExport'){copyExport();return}
});
render();
</script>
</body>
</html>
