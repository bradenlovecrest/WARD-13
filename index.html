.machine{background:linear-gradient(155deg,#0a1421,#14283b);border:2px solid #415b70;border-radius:14px;padding:15px;box-shadow:inset 0 0 28px #0008}.machine-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;color:#9bd5d5;font:700 .72rem ui-monospace,monospace;letter-spacing:.08em}.machine .light{width:9px;height:9px;background:#89f9c1;border-radius:50%;box-shadow:0 0 13px #7debc0}.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.readout{background:#050e17;border:1px solid #345663;padding:11px 8px;border-radius:7px;text-align:center}.readout strong{display:block;color:#90f0d4;font:800 clamp(.9rem,2vw,1.5rem) ui-monospace,monospace}.readout small{color:#9ab3c2;font:.65rem ui-monospace,monospace}.lab-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:15px;align-items:center;border-bottom:1px solid #2f485b;padding:12px 0}.lab-row:last-child{border:none}.lab-row .lab-values{font:.84rem ui-monospace,monospace;color:#b4e9e2;line-height:1.8}.lab-row strong{font-size:.84rem;color:#f7d4ac}.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.seg.four{grid-template-columns:repeat(2,minmax(0,1fr))}.seg .pick{font-size:.76rem;padding:8px 7px;min-height:35px;border-radius:7px;border:1px solid #405669;background:#172635;color:#c8d8e1}.seg .pick.active{background:#266257;color:white;border-color:#a6ffd2}.empty-note{color:#8da1b2;font-size:.76rem}

.pathway{display:flex;align-items:center;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}.pathnode{font-size:.77rem;text-align:center;min-width:90px;padding:14px 10px;background:#172b3d;border:1px solid #536e7d;border-radius:10px}.pathnode.selected{border:2px solid var(--gold);background:#61415a}.arrow{color:#9bc4cd;font-size:1.4rem}.sensor{display:flex;justify-content:space-between;align-items:center;background:#162332;padding:10px;border:1px solid #476171;border-radius:9px;margin:5px 0}.sensor button{min-width:66px}

.finish{min-height:75vh;display:grid;place-content:center;gap:20px}.finish h1{font-size:clamp(3rem,8vw,6.3rem);line-height:1;color:#a0f4ce;letter-spacing:-.06em}.finish .report{max-width:930px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-card{padding:15px;border:1px solid #415b60;background:#10232a;border-radius:11px}.report-card strong{display:block;color:#ebcb93;font-size:1.3rem}.report-card small{color:#b8ccd6;font-size:.69rem}.pause-screen{max-width:720px;margin:60px auto;padding:35px;text-align:center;border:1px solid #b1779b;border-radius:15px;background:radial-gradient(circle at 50% -15%,#3f2844,#111a28 67%)}.pause-screen h2{font-size:3rem}.toast{position:fixed;z-index:60;bottom:22px;left:50%;transform:translate(-50%,140px);width:min(580px,calc(100% - 28px));border:1px solid #718e8b;background:#123b3c;padding:14px 18px;box-shadow:0 13px 50px #000c;border-radius:10px;font-size:.89rem;line-height:1.45;opacity:0;pointer-events:none;transition:transform .25s,opacity .25s}.toast.show{transform:translate(-50%,0);opacity:1}.toast.error{background:#472a37;border-color:#d97991}.footer{max-width:1230px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#7e94a7;padding:25px 20px;font:.62rem ui-monospace,monospace;letter-spacing:.06em;border-top:1px solid #233648}

<script>/* WARD 13 — THE PROTOCOL: AFTER HOURS / offline single-file learning escape room */
'use strict';
const SOURCES={
 ABG:'Faculty remediation list: ABGs; N311 Friday Remediation Focused Study Guide pp. 1–2; annotated Exam 1 acid–base review.',
 INF:'Faculty remediation list: inflammation (five cardinal signs) and glucocorticoids; N311 remediation guide pp. 2–3; Exam 1 immunity review.',
 GI:'Faculty remediation list: cirrhosis, Crohn disease and ulcerative colitis; N311 GI Exam-Review-Only guide pp. 2–3; Exam 2 Review (1).',
 CARD:'Faculty remediation list: preload/afterload and hypertension drugs; N311 remediation guide p. 4; Exam 2 cardiac/medication review.',
 ENDO:'Faculty remediation list: diabetes mellitus and adrenal disorders; N311 remediation guide p. 5; Exam 2 endocrine review.',
 RESP:'Faculty remediation list: respiratory medication teaching; N311 remediation guide p. 6; Exam 1 respiratory review.',
 FINAL:'Fictional in-game evidence sequence; no outside clinical facts are required.'
};
const RANGES='Course reference ranges: pH 7.35–7.45 · PaCO₂ 35–45 mmHg · HCO₃⁻ 22–26 mEq/L.';
const RANGES2='Reference values: Na⁺ 135–145 mEq/L · K⁺ 3.5–5.0 mEq/L · fasting glucose approximately 70–99 mg/dL (lab ranges can vary).';
const puzzles=[
 {id:'abg',room:0,num:1,kind:'strips',title:'The Misfiled Blood Gases',domain:'ABGs',intro:'A 1970s analyzer has printed four specimen strips in the wrong diagnostic drawers. Recalibrate the drawer beneath each set of laboratory values.',prompt:'Use the acid/base pattern; tap a diagnosis on each strip. This mechanism resets only when all four are classified.',ref:RANGES,rows:[['A','pH 7.29 / PaCO₂ 55 / HCO₃⁻ 24','Respiratory acidosis'],['B','pH 7.51 / PaCO₂ 29 / HCO₃⁻ 24','Respiratory alkalosis'],['C','pH 7.28 / PaCO₂ 40 / HCO₃⁻ 16','Metabolic acidosis'],['D','pH 7.50 / PaCO₂ 42 / HCO₃⁻ 33','Metabolic alkalosis']],choices:['Respiratory acidosis','Respiratory alkalosis','Metabolic acidosis','Metabolic alkalosis'],hint1:'Determine whether pH is acidemic or alkalemic first. CO₂ moves opposite pH; bicarbonate moves with pH.',hint2:'A: carbon dioxide drives the change. B: carbon dioxide is low. C: bicarbonate is low. D: bicarbonate is high.',why:'A: respiratory acidosis; B: respiratory alkalosis; C: metabolic acidosis; D: metabolic alkalosis. This classification is about the primary pH disturbance, not oxygenation.',source:SOURCES.ABG},
 {id:'dkacircuit',room:0,num:2,kind:'place',title:'The Breathing Circuit',domain:'ABGs',intro:'The ward has chained a DKA specimen to a faulty ventilator diagram. Route the root cause to the left socket and the body’s compensating response to the right socket.',prompt:'Patient: type 1 DM, deep rapid respirations. pH 7.28, PaCO₂ 29 mmHg, HCO₃⁻ 14 mEq/L. Make two correct connections.',ref:RANGES,slots:[['root','PRIMARY DISTURBANCE'],['comp','COMPENSATION']],tokens:[['ketones','Ketone acids consume bicarbonate → metabolic acidosis'],['hypervent','Deep rapid breaths expel CO₂ → respiratory compensation'],['co2ret','CO₂ retention from slow breathing'],['gastric','Gastric acid loss through vomiting']],answer:{root:'ketones',comp:'hypervent'},hint1:'The pH is low, and bicarbonate is low. Why is carbon dioxide also low?',hint2:'Place ketone-related loss of bicarbonate at the primary socket. Low CO₂ from deep breathing is the response.',why:'DKA produces ketoacids causing metabolic acidosis; hyperventilation lowers PaCO₂ as respiratory compensation. The low CO₂ is not the cause of the acidemia.',source:SOURCES.ABG},
 {id:'hand',room:0,num:3,kind:'hand',title:'The Five-Finger Examination',domain:'Inflammation',intro:'A crimson handprint appears on the wall. Five clinical signs have been etched into its fingers. Place each physiological explanation in the correct finger.',prompt:'Tap an explanation from the evidence tray, then tap the finger it explains.',slots:[['red','REDNESS / RUBOR'],['heat','HEAT / CALOR'],['swell','SWELLING / TUMOR'],['pain','PAIN / DOLOR'],['lost','LOSS OF FUNCTION']],tokens:[['vaso','Local arteriolar vasodilation increases blood flow'],['warm','More warm blood is delivered to the site'],['leak','Permeable capillaries allow fluid into the interstitium'],['nocicept','Bradykinin/prostaglandins and tissue pressure activate pain pathways'],['limited','Pain, edema and injury impede normal use']],answer:{red:'vaso',heat:'warm',swell:'leak',pain:'nocicept',lost:'limited'},hint1:'The two visible color/temperature clues are related to increased blood flow, but swelling comes from leakage.',hint2:'Redness = vasodilation; heat = warm blood; swelling = leak; pain = inflammatory mediators; function = limited by injury.',why:'The five cardinal signs arise from vasodilation (rubor), increased warm flow (calor), permeability and exudate (tumor), pain mediators/pressure (dolor), and impaired use (functio laesa).',source:SOURCES.INF},
 {id:'steroid',room:1,num:4,kind:'switch',title:'The Prednisone Safety Cabinet',domain:'Inflammation',intro:'You find a taper card hidden inside a locked medication cupboard. The machine will dispense the exit key only if safe teaching switches are turned ON and dangerous statements remain OFF.',prompt:'Set the five switches to SAFE / UNSAFE based on systemic glucocorticoid effects and patient teaching. All five must be correct.',rows:[['glucose','Monitor blood glucose as directed; prednisone may raise it.',true],['sudden','Stop prolonged systemic prednisone abruptly when symptoms improve.',false],['infection','Report possible infection and monitor for infection symptoms.',true],['protect','Prednisone strengthens immunity and prevents infection.',false],['taper','Follow a clinician-directed taper after prolonged systemic use.',true]],hint1:'Glucocorticoids suppress immune activity and increase blood glucose. Long-term therapy can suppress endogenous cortisol.',hint2:'The three true statements are monitoring glucose, infection awareness, and following taper directions. Do not abruptly stop a prolonged course.',why:'Prednisone broadly suppresses inflammation but can cause hyperglycemia, infection risk, and HPA-axis suppression. Long courses require individualized discontinuation advice.',source:SOURCES.INF},
 {id:'bowel',room:1,num:5,kind:'place',title:'The Pathology Lightbox',domain:'GI',intro:'Biopsy slides are scattered beneath a flickering lightbox. One rack is for Crohn disease; the other is for ulcerative colitis. The tissue labels are smeared.',prompt:'Sort six slide findings into the correct diagnosis rack.',slots:[['c1','Crohn rack · slide 1'],['c2','Crohn rack · slide 2'],['c3','Crohn rack · slide 3'],['u1','UC rack · slide 1'],['u2','UC rack · slide 2'],['u3','UC rack · slide 3']],tokens:[['trans','Deep transmural bowel-wall inflammation'],['skip','Skip lesions, sometimes in terminal ileum'],['fistula','Fistulas or strictures due to penetrating injury'],['rect','Begins at the rectum and extends continuously'],['mucosa','Primarily mucosal colonic inflammation'],['bloody','Frequent bloody diarrhea with urgency']],answer:{c1:'trans',c2:'skip',c3:'fistula',u1:'rect',u2:'mucosa',u3:'bloody'},unorderedGroups:[['c1','c2','c3'],['u1','u2','u3']],hint1:'Crohn can occur anywhere, skips areas, and may affect the full bowel wall. UC is continuous from the rectum and mainly mucosal.',hint2:'Crohn = transmural + skip + fistula. UC = rectal origin + mucosa + bloody urgency.',why:'Crohn often has skip areas and transmural disease, which can create fistulas/strictures; UC is continuous and primarily colonic mucosal disease with bloody stools.',source:SOURCES.GI},
 {id:'ascites',room:1,num:6,kind:'valves',title:'The Ascites Pressure Engine',domain:'GI',intro:'A suspended glass abdomen is filling with fluid. Three brass valves control the forces driving ascites in cirrhosis. Correct the pressure system.',prompt:'Turn each valve until it matches the mechanism of cirrhotic ascites. High portal pressure; low oncotic pull from albumin; active renal sodium/water retention.',valves:[['portal','PORTAL HYDROSTATIC PRESSURE',['LOW','NORMAL','HIGH'],2],['albumin','ALBUMIN / ONCOTIC PULL',['LOW','NORMAL','HIGH'],0],['renal','RENAL Na⁺/WATER RETENTION',['OFF','BASELINE','ON'],2]],hint1:'Fibrosis raises resistance in the portal system. Loss of albumin weakens the force holding fluid inside vessels.',hint2:'Portal = HIGH, albumin / oncotic pull = LOW, kidney sodium/water retention = ON.',why:'Cirrhosis produces portal hypertension, reduced albumin-related plasma oncotic pressure, and neurohormonal sodium/water retention—all contributing to ascites.',source:SOURCES.GI},
 {id:'hemo',room:2,num:7,kind:'lever',title:'The Chamber of Two Pressures',domain:'Cardiac',intro:'The heart model is splitting in two. One lever controls filling before contraction; the other is the resistance the ventricle must overcome during ejection.',prompt:'Route each clinical change to PRELOAD or AFTERLOAD.',rows:[['venous','Venous return increases, raising end-diastolic stretch.','PRELOAD'],['htn','Systemic hypertension makes ejection harder.','AFTERLOAD'],['fluid','Increased circulating volume increases filling.','PRELOAD'],['narrow','Arterial vasoconstriction raises resistance to ejection.','AFTERLOAD']],hint1:'PRE = venous return and filling/stretch. AFTER = arterial resistance to ejection.',hint2:'Venous return and volume affect PRELOAD; hypertension and vasoconstriction affect AFTERLOAD.',why:'Preload is ventricular end-diastolic stretch/filling, related to venous return. Afterload is the arterial load opposing blood ejection.',source:SOURCES.CARD},
 {id:'ace',room:2,num:8,kind:'pathway',title:'The ACE Circuit Board',domain:'Cardiac',intro:'The blood-pressure control circuit has an empty red clamp. Place it where lisinopril blocks the renin-angiotensin pathway, then engage three safety monitors.',prompt:'Choose the blocked step and turn on monitoring for potassium, kidney function, and dangerous angioedema symptoms. Leave unrelated sensors off.',nodes:['Renin release','ACE: angiotensin I → II','AT₁ receptor','β₁ cardiac receptor'],answerNode:1,sensors:[['potassium','Potassium / hyperkalemia risk',true],['creatinine','Renal function / creatinine',true],['swelling','Face or tongue swelling / angioedema',true],['bloodsugar','Required routine hearing test',false]],hint1:'Lisinopril is an ACE inhibitor; this blocks angiotensin II formation, not its receptor. Monitor K⁺ and kidney function.',hint2:'Clamp the ACE conversion step. Turn ON potassium, creatinine, and angioedema warning; leave the hearing-test port OFF.',why:'ACE inhibition reduces angiotensin II and aldosterone effects. Important safety issues include elevated potassium, renal changes, cough, and potentially life-threatening angioedema.',source:SOURCES.CARD},
 {id:'medwheel',room:2,num:9,kind:'place',title:'The Antihypertensive Carousel',domain:'Cardiac',intro:'Three drug vials rotate over three receptor plates. Match each drug to what it mainly blocks.',prompt:'Place the right medication on each effect plate. Every vial is used once.',slots:[['beta1','Selective β₁ blockade → reduced heart rate/workload'],['mixed','β + α₁ blockade → slower heart activity plus vasodilation'],['at1','Angiotensin II AT₁ receptor blockade (not ACE)']],tokens:[['met','Metoprolol'],['car','Carvedilol'],['los','Losartan (ARB)']],answer:{beta1:'met',mixed:'car',at1:'los'},hint1:'Metoprolol is β₁ selective. Carvedilol blocks β as well as α₁. Losartan acts on AT₁ receptors.',hint2:'Metoprolol → β₁; carvedilol → β and α₁; losartan → AT₁.',why:'β₁-selective blockade reduces sympathetic heart stimulation; carvedilol also provides α₁-related vasodilation; an ARB blocks the AT₁ receptor, distinct from ACE inhibition.',source:SOURCES.CARD},
 {id:'glucart',room:3,num:10,kind:'place',title:'The Pancreatic Conveyor',domain:'Endocrine',intro:'A disassembled pharmaceutical assembly line is throwing the wrong drugs into the wrong mechanisms. The pancreas alarm sounds every six seconds.',prompt:'Deliver each drug to its correct mechanism station.',slots:[['replace','REPLACE MISSING INSULIN'],['liver','REDUCE HEPATIC GLUCOSE PRODUCTION'],['release','STIMULATE β-CELL INSULIN SECRETION']],tokens:[['ins','Insulin'],['met','Metformin'],['gli','Glipizide']],answer:{replace:'ins',liver:'met',release:'gli'},hint1:'Type 1 diabetes requires insulin because β-cells have been destroyed. Metformin mostly acts on liver glucose production.',hint2:'Insulin → replace hormone; metformin → reduce hepatic gluconeogenesis; glipizide → make β-cells release insulin.',why:'Insulin supplies insulin action; metformin reduces hepatic glucose output and improves sensitivity; glipizide stimulates β-cell insulin secretion and may cause hypoglycemia if meals are skipped.',source:SOURCES.ENDO},
 {id:'adrenal',room:3,num:11,kind:'adrenal',title:'The Adrenal Mirror',domain:'Endocrine',intro:'Two case files are reflected in the mirror. One patient is missing essential adrenal hormones; the other is drowning in cortisol.',prompt:'For each patient, select the cortisol level and diagnosis that explain the findings.',ref:RANGES2,cases:[['A','BP 86/52, Na⁺ 128 mEq/L, K⁺ 5.8 mEq/L, fasting glucose 57 mg/dL; fatigue and hyperpigmentation.','LOW','Primary adrenal insufficiency (Addison)'],['B','BP 162/96, fasting glucose 225 mg/dL, purple striae, easy bruising and central weight gain.','HIGH','Cushing syndrome']],hormones:['LOW','HIGH'],diagnoses:['Primary adrenal insufficiency (Addison)','Cushing syndrome'],hint1:'Primary Addison disease often involves low cortisol and aldosterone, producing hypotension, hyponatremia, hyperkalemia and low glucose.',hint2:'Case A = LOW cortisol / Addison. Case B = HIGH cortisol / Cushing.',why:'Primary adrenal insufficiency commonly reduces cortisol and aldosterone; Cushing syndrome reflects cortisol excess with hyperglycemia, hypertension, striae and central weight redistribution.',source:SOURCES.ENDO},
 {id:'safety',room:3,num:12,kind:'sequence',title:'The Hypoglycemia Response Chain',domain:'Endocrine',intro:'A glipizide patient skipped breakfast and now appears shaky. A sticky note reads “Glucose 52 mg/dL” beside the ordinary fasting reference range. The safety protocol has been shredded into four pieces.',prompt:'Reassemble the nursing-reasoning sequence by tapping the four loose instruction tiles in the appropriate order.',ref:'For context: fasting glucose approximately 70–99 mg/dL. Patient measured glucose 52 mg/dL. Follow your actual clinical hypoglycemia protocol for treatment.',tiles:[['recognize','Recognize possible medication-associated hypoglycemia after a missed meal'],['check','Check/verify blood glucose and assess symptoms'],['respond','Respond promptly using the prescribed hypoglycemia protocol'],['reassess','Reassess response and reinforce meal/medication timing']],answer:['recognize','check','respond','reassess'],hint1:'Recognize the safety problem, confirm the glucose, act, then reassess and prevent recurrence.',hint2:'Recognize → check → respond per protocol → reassess and teach.',why:'Sulfonylureas such as glipizide stimulate insulin secretion; skipped meals increase hypoglycemia risk. This sequence models recognizing, checking, responding, and reassessing; follow local clinical policy for actual management.',source:SOURCES.ENDO},
 {id:'inhalers',room:4,num:13,kind:'place',title:'The Inhaler Sorting Lattice',domain:'Respiratory',intro:'Four inhalers are scattered around the desk. The ventilation console cannot distinguish rescue from maintenance treatment.',prompt:'Place each medication beneath its correct function. Use all four.',slots:[['rescue','FAST RESCUE BRONCHODILATION'],['laba','LONG-ACTING β₂ MAINTENANCE'],['sama','ANTIMUSCARINIC BRONCHODILATION'],['ics','INHALED ANTI-INFLAMMATORY CONTROLLER']],tokens:[['alb','Albuterol (SABA)'],['sal','Salmeterol (LABA)'],['ipr','Ipratropium (SAMA)'],['bud','Budesonide / fluticasone (ICS)']],answer:{rescue:'alb',laba:'sal',sama:'ipr',ics:'bud'},hint1:'Short-acting β₂ agonist is rescue; LABA is maintenance; ipratropium is an anticholinergic; ICS controls inflammation.',hint2:'Albuterol → rescue; salmeterol → LABA; ipratropium → antimuscarinic; budesonide/fluticasone → ICS.',why:'Albuterol provides rapid relief; salmeterol is a maintenance LABA and should not be used alone in asthma; ipratropium blocks muscarinic bronchoconstriction; ICS treats inflammation.',source:SOURCES.RESP},
 {id:'counsel',room:4,num:14,kind:'place',title:'The Discharge Telephone Switchboard',domain:'Respiratory',intro:'Five patients are on hold and every phone line has the wrong discharge instruction. Reconnect each medication to its most important teaching clue.',prompt:'Tap an instruction tile, then a patient handset. Every instruction is used once.',slots:[['a','ALBUTEROL'],['s','SALMETEROL'],['i','IPRATROPIUM'],['b','BUDESONIDE / FLUTICASONE'],['p','SYSTEMIC PREDNISONE']],tokens:[['palp','Expect possible tremor/palpitations; frequent rescue use suggests poor control'],['notrescue','Not for immediate relief; never LABA alone in asthma'],['eyes','Dry mouth possible; do not spray toward eyes'],['rinse','Rinse mouth and spit after doses to reduce thrush'],['sugar','Watch glucose, infection signs and mood; taper prolonged courses as prescribed']],answer:{a:'palp',s:'notrescue',i:'eyes',b:'rinse',p:'sugar'},hint1:'Think purpose and class: SABA causes tremor/tachycardia, LABA is maintenance, antimuscarinic dries, inhaled steroid risks thrush, systemic steroid raises glucose.',hint2:'Albuterol → palpitations; salmeterol → not rescue/never alone for asthma; ipratropium → avoid eyes; ICS → rinse; prednisone → glucose/infection/taper.',why:'Teaching must be tailored to drug class and route. Rinse after ICS, distinguish rescue from maintenance, monitor systemic steroid risks, and teach safe inhaler technique.',source:SOURCES.RESP},
 {id:'exit',room:4,num:15,kind:'cipher',title:'The Last Door',domain:'Final mechanism',intro:'The deadbolt has four rotating brass tumblers. Four evidence seals are stamped with symbols and digits. A scratched phrase is visible under the EXIT light.',prompt:'Reorder the four seals by the poem, then set each corresponding number on the tumblers. Read the clues—do not guess at the numbers.',poem:'“First comes the breath. Then the pulse. Next the red wound blooms. Last, the sweetness in the blood.”',answer:[7,2,4,9],hint1:'The poem names four earlier stations, not the chronological room order. Breath = blood gases; pulse = cardiac; red wound = inflammation; sweetness = endocrine.',hint2:'Use seal digits in this order: ABG → PRESSURE → INFLAMMATION → GLUCOSE.',why:'The four collected seals connect evidence across the ward: blood gases (7), blood pressure (2), inflammation (4), and endocrine glucose (9). The code is 7249.',source:SOURCES.FINAL}
];
const rooms=[
 {name:'The Arterial Archive',subtitle:'The machines breathe even when the power is off.',color:'#80d8d9',sigil:'◈',sealName:'BLOOD GAS',seal:7,objects:[
  {id:'gasguide',kind:'evidence',icon:'📋',label:'ABG Reference',note:'The lab clipboard lists normal ranges and the rule: carbon dioxide behaves as a respiratory acid; bicarbonate as a metabolic base. It is the direction of the pH that reveals the disturbance.',extra:RANGES},
  {id:'abg',kind:'station',icon:'🧪',label:'Specimen Analyzer',p:'abg',reqSee:'gasguide'},
  {id:'dkalogs',kind:'evidence',icon:'📼',label:'Tape Recorder',note:'The tape whispers: “DKA is an acid problem. When a patient breathes deeply and quickly, they blow off CO₂ to defend their pH.”'},
  {id:'dkacircuit',kind:'station',icon:'🫁',label:'Breathing Circuit',p:'dkacircuit',reqSee:'dkalogs'},
  {id:'uv',kind:'tool',icon:'🔦',label:'UV Penlight',item:'UV',note:'You pocket a violet inspection light. Etchings invisible under the white ceiling lights now respond to its beam. It may help much later.'},
  {id:'hand',kind:'station',icon:'🖐️',label:'Handprint Lock',p:'hand'}]},
 {name:'The Steroid Conservatory',subtitle:'The IV bags have roots. None of the plants have leaves.',color:'#a7d29c',sigil:'✚',sealName:'INFLAMMATION',seal:4,objects:[
  {id:'plant',kind:'evidence',icon:'🪴',label:'Glasshouse Journal',note:'The resident wrote: “Steroids calm inflammation but make infections harder to fight, raise blood glucose and, after prolonged therapy, may suppress natural adrenal hormones.”'},
  {id:'key',kind:'tool',icon:'🗝️',label:'Rusty Key',item:'BRASS KEY',note:'Behind a glass planter is a brass key, its teeth shaped like a small cross. It fits the medication cabinet.'},
  {id:'steroid',kind:'station',icon:'💊',label:'Prednisone Safe',p:'steroid',reqItem:'BRASS KEY'},
  {id:'bowelchart',kind:'evidence',icon:'🗂️',label:'Pathology Sketches',note:'Two sketches: Crohn disease has scattered deep lesions; ulcerative colitis forms an unbroken inflamed ribbon beginning in the rectum. Labels on six slides have fallen off.'},
  {id:'bowel',kind:'station',icon:'🔬',label:'Biopsy Lightbox',p:'bowel',reqSee:'bowelchart'},
  {id:'ascites',kind:'station',icon:'⚙️',label:'Ascites Engine',p:'ascites'}]},
 {name:'The Hemodynamic Engine',subtitle:'You hear a heartbeat through the concrete.',color:'#f0c187',sigil:'⌁',sealName:'PRESSURE',seal:2,objects:[
  {id:'flowchart',kind:'evidence',icon:'📊',label:'Pressure Tracing',note:'PRELOAD = the blood returning to stretch the ventricle before it contracts. AFTERLOAD = the pressure/resistance opposing blood ejection.'},
  {id:'hemo',kind:'station',icon:'🫀',label:'Two-Lever Heart',p:'hemo',reqSee:'flowchart'},
  {id:'fuse',kind:'tool',icon:'🔩',label:'Loose Fuse',item:'COPPER FUSE',note:'Under the telemeter is a single warm copper fuse, marked ACE. A circuit breaker is missing one piece.'},
  {id:'ace',kind:'station',icon:'🔌',label:'ACE Circuit',p:'ace',reqItem:'COPPER FUSE'},

const TOKEN_KEY='ward13_protocol_after_hours_v2';
const initial=()=>({started:false,paused:false,finished:false,room:0,seen:{},done:{},work:{},inventory:[],seals:[],errors:0,hints:{},misses:{},elapsed:0,sound:false,view:null,notice:null});

const el=document.getElementById('app'),controls=document.getElementById('top-controls');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtClock(){return `${String(Math.floor(state.elapsed/60)).padStart(2,'0')}:${String(state.elapsed%60).padStart(2,'0')}`}
function save(){try{localStorage.setItem(TOKEN_KEY,JSON.stringify(state))}catch(e){}}
function getP(id){return puzzles.find(p=>p.id===id)}
function w(id){return state.work[id]||(state.work[id]={})}
function countDone(){return puzzles.filter(p=>state.done[p.id]).length}
function roomDone(){return rooms[state.room].objects.filter(o=>o.kind==='station').every(o=>state.done[o.p])}

function cover(){return `<main class="cover"><div><div class="eyebrow">RESTRICTED FILE · NOVEMBER 10 · 23:13</div><h1>WARD<br><span>13</span><small>THE PROTOCOL / AFTER HOURS</small></h1><p class="cover-sub">The hospital has been closed for thirteen years. Tonight, someone switched the machines back on. To leave, you'll have to examine the evidence, repair the clinical devices, and undo the ward's fifteen locks.</p><div class="buttons"><button class="btn primary" data-act="start">ENTER THE WARD →</button><button class="btn ghost" data-act="rules">HOW THE LOCKS WORK</button></div><div class="cover-quote">“Every room is a diagnosis. Every diagnosis is a door.”</div><p class="muted" style="font-size:.82rem;margin-top:22px">5 explorable rooms · 15 mechanisms · 6 NURS 311 remediation topics · about 35–60 minutes · offline · save/resume · optional hints · no sudden jump scares.</p>${state.notice?`<div class="rule">${esc(state.notice)}</div>`:''}</div><div class="poster" aria-label="Illustration of a dimly lit hospital door marked 13"><div class="poster-lamp"></div><div class="poster-door"></div><div class="redlight"></div><div class="poster-foot"><span>NO VISITORS AFTER DARK</span><span>⦿ REC</span></div></div></main>`}
function pauseScreen(){return `<div class="pause-screen"><div class="eyebrow">INTERRUPTED TRANSMISSION</div><h2>WARD ON HOLD</h2><p>The hallway has gone silent. Your evidence, unlocked mechanisms, elapsed time, and inventory are saved in this browser where supported.</p><p class="gold mono">${fmtClock()} ELAPSED · ${countDone()} / 15 LOCKS</p><div class="buttons" style="justify-content:center;margin-top:20px"><button class="btn primary" data-act="pause">RESUME THE NIGHT SHIFT</button><button class="btn ghost" data-act="reset">RESTART FROM ZERO</button></div></div>`}
function hud(){return `<div class="hud"><div class="hud-item"><strong>${state.room+1}/5</strong><small>ROOM</small></div><div class="hud-item"><strong>${countDone()}/15</strong><small>LOCKS OPEN</small></div><div class="hud-item"><strong id="live-clock">${fmtClock()}</strong><small>ELAPSED</small></div><div class="hud-item"><strong>${state.errors}</strong><small>FALSE TRIES</small></div><div class="hud-item"><strong>${Object.values(state.hints).reduce((a,b)=>a+b,0)}</strong><small>HINTS</small></div></div>`}

function inventory(){const items=[...state.inventory.map(id=>`<span class="inventory-item">${esc({'UV':'🔦','BRASS KEY':'🗝️','COPPER FUSE':'🔩','STAFF BADGE':'🪪'}[id]||'🧰')} ${esc(id)}</span>`),...state.seals.map(x=>`<span class="inventory-item seal">${esc(x.sigil)} ${esc(x.name)} / ${x.digit}</span>`)];return `<aside class="panel inventory"><h3>▣ INVENTORY <span class="muted mono" style="font-size:.72rem">${items.length} ITEMS</span></h3><div class="inventory-items">${items.length?items.join(''):'<span class="muted" style="font-size:.84rem">Search the room. Useful evidence goes here.</span>'}</div><p class="muted" style="font-size:.76rem;margin:10px 0 0">Tools carry between rooms; seals are recovered when each gate opens.</p></aside>`}

function roomScreen(){const r=rooms[state.room],done=r.objects.filter(o=>o.kind==='station').filter(o=>state.done[o.p]).length;document.documentElement.style.setProperty('--room',r.color);return `${trail()}${hud()}<div class="room-heading"><div><div class="eyebrow">CHAPTER 0${state.room+1} · THREE MECHANISMS</div><h2>${esc(r.name)}</h2><p>${esc(r.subtitle)}</p></div><span class="pill ${done===3?'ok':''}">${done}/3 ROOM LOCKS</span></div>${scene()}<div class="stage-bottom"><section class="panel objective"><h3>✦ YOUR OBJECTIVE</h3><p>Inspect clues and loose equipment. Select any glowing device to investigate its lock. Use your inventory, activate the machinery, and open all three mechanisms.</p><div class="buttons"><button class="btn sm ghost" data-act="rules">HOW TO PLAY</button>${roomDone()&&state.room<4?`<button class="btn sm primary" data-act="advance">OPEN THE NEXT DOOR →</button>`:''}${roomDone()&&state.room===4?`<span class="pill ok">FINAL MECHANISM CLEARED</span>`:''}</div></section>${inventory()}</div>${state.view?workbench():`<div class="rule" style="margin-top:17px">${roomDone()&&state.room<4?'All three locks are open. Recover this room’s evidence seal and enter the next ward.':'The room contains three active locks and three clues or tools. Some devices need the right evidence or equipment before they will activate.'}</div>`}`}
function evidenceView(o){return `<div class="paper"><h3>PROPERTY OF WARD 13</h3><p>${esc(o.uv&&!state.inventory.includes('UV')?'Faint etchings cover the wall, but you cannot read the symbols in this light. An ultraviolet inspection pen might reveal the writing.':o.note)}</p>${o.extra?`<p><strong>${esc(o.extra)}</strong></p>`:''}${o.uv&&!state.inventory.includes('UV')?'<p><small>There is more beneath the surface. Something that emits violet light could reveal it.</small></p>':''}<p><small>STAMP: ${esc(rooms[state.room].name.toUpperCase())} // FILE ${esc(o.id.toUpperCase())}</small></p></div>${o.kind==='tool'?`<p class="muted">${state.inventory.includes(o.item)?'✓ This tool is in your inventory.':'Tap TAKE ITEM to keep this for future rooms.'}</p><button class="btn primary" data-act="take" data-id="${o.id}" ${state.inventory.includes(o.item)?'disabled':''}>TAKE ${esc(o.item)}</button>`:''}`}
function canAccess(o){if(o.reqSee&&!state.seen[o.reqSee])return `Examine “${rooms[state.room].objects.find(x=>x.id===o.reqSee)?.label||'the case notes'}” first. Its evidence is required to activate this device.`;if(o.reqItem&&!state.inventory.includes(o.reqItem))return `This machine needs ${o.reqItem}. Search the room for something that fits.`;if(o.reqDone&&o.reqDone.some(id=>!state.done[id]))return 'The exit deadbolt remains sealed until both respiratory workstations have been repaired.';return ''}
function workbench(){const o=rooms[state.room].objects.find(x=>x.id===state.view);if(!o)return '';const p=o.kind==='station'?getP(o.p):null;const blocked=p?canAccess(o):'';return `<section class="workbench" id="workbench"><div class="work-head"><div><small>▣ ${p?`LOCK ${String(p.num).padStart(2,'0')} / 15 · ${esc(p.domain)}`:o.kind==='tool'?'FOUND EQUIPMENT':'INVESTIGATION FILE'}</small><h3>${p?esc(p.title):esc(o.label)}</h3></div><button class="btn sm ghost" data-act="close">✕ CLOSE</button></div><div class="work-body">${!p?evidenceView(o):blocked?`<div class="feedback">⛔ ${esc(blocked)}</div>`:puzzleUI(p)}${p?`<div class="source-tag">SOURCE PRIORITY: ${esc(p.source)}</div>`:''}</div></section>`}
function snippet(p){const solved=state.done[p.id],miss=state.misses[p.id]||0,seenHint=state.hints[p.id]||0;return `<p class="story">${esc(p.intro)}</p><div class="rule">${esc(p.prompt)}</div>${p.ref?`<div class="lab-reference">${esc(p.ref)}</div>`:''}${solved?'':miss?`<div class="feedback">⚠️ ${miss} rejected attempt${miss>1?'s':''}. The machinery remains locked. Reinspect the clue or request a hint.</div>`:''}${solved?'':seenHint?`<div class="hint-box"><b>THE WALL WHISPERS ${seenHint}/2:</b> ${esc(seenHint===1?p.hint1:p.hint2)}</div>`:''}`}
function workControls(p){if(state.done[p.id])return `<div class="rationale"><b>✓ MECHANISM UNLOCKED</b><p>${esc(p.why)}</p></div><div class="buttons" style="margin-top:14px"><button class="btn sm ghost" data-act="close">RETURN TO ROOM</button></div>`;return `<div class="action-strip"><button class="btn primary" data-act="submit" data-p="${p.id}">ACTIVATE MECHANISM →</button><button class="btn ghost sm" data-act="hint" data-p="${p.id}">☾ ${state.hints[p.id]>=2?'HINTS REVEALED':'WHISPER A HINT'}</button><button class="btn ghost sm" data-act="clear" data-p="${p.id}">RESET PANEL</button></div>`}

 if(p.kind==='valves')return `<div class="machine"><div class="machine-h">HYDRAULIC CONTROL // 3 VALVES<span class="light"></span></div><div class="valves">${p.valves.map(([id,label,opts])=>{let v=t.values?.[id]??1;return `<div class="valve"><strong>${esc(label)}</strong><div class="dial" style="--rotate:${(v-1)*95}deg"></div><div class="value">${esc(opts[v])}</div><button class="btn sm" data-act="dial" data-p="${p.id}" data-k="${id}">↻ TURN</button></div>`}).join('')}</div><p class="muted" style="text-align:center;font-size:.8rem">Turn each dial through its three positions to restore the proper pressure balance.</p></div>`;

 if(p.kind==='pathway')return `<div class="machine"><div class="machine-h">RENIN–ANGIOTENSIN CONTROL BOARD<span class="light"></span></div><p class="muted" style="font-size:.85rem">Place the red ACE inhibitor clamp on the blocked step:</p><div class="pathway">${p.nodes.map((v,i)=>`${i>0?'<span class="arrow">➜</span>':''}<button class="pathnode ${t.node===i?'selected':''}" data-act="node" data-p="${p.id}" data-v="${i}">${t.node===i?'⛔ ':''}${esc(v)}</button>`).join('')}</div><p class="gold caps" style="margin-top:19px">ACTIVATE SAFETY SENSORS</p>${p.sensors.map(([id,text])=>`<div class="sensor"><span style="font-size:.85rem">${esc(text)}</span><button class="btn sm ${t.sensors?.[id]?'good':''}" data-act="sensor" data-p="${p.id}" data-k="${id}">${t.sensors?.[id]?'✓ ON':'OFF'}</button></div>`).join('')}</div>`;
 if(p.kind==='adrenal')return `<div class="machine"><div class="machine-h">ADRENAL CASE COMPARATOR<span class="light"></span></div>${p.cases.map(([id,clue])=>`<div class="lab-row" style="display:block"><strong>CHART ${id}</strong><p style="color:#d1e2e4;font-size:.88rem">${esc(clue)}</p><div class="lab-row" style="border:none;grid-template-columns:1fr 1fr;padding:6px 0"><div><small class="muted caps">CORTISOL LEVEL</small><div class="seg">${p.hormones.map(x=>`<button class="pick ${t.values?.[id+'h']===x?'active':''}" data-act="pick" data-p="${p.id}" data-k="${id}h" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><div><small class="muted caps">DIAGNOSIS</small><div class="seg">${p.diagnoses.map((x,i)=>`<button class="pick ${t.values?.[id+'d']===x?'active':''}" data-act="pick" data-p="${p.id}" data-k="${id}d" data-v="${esc(x)}">${i===0?'ADDISON':'CUSHING'}</button>`).join('')}</div></div></div></div>`).join('')}</div>`;
 if(p.kind==='sequence')return `<div class="machine"><div class="machine-h">NURSING SAFETY CHAIN / ORDER MATTERS <span class="light"></span></div><div class="caps gold" style="margin-bottom:8px">YOUR ASSEMBLED CHAIN</div><div class="sequence">${(t.sequence||[]).map((id,i)=>`<button class="sequence-step selected" data-act="seqremove" data-p="${p.id}" data-k="${id}"><b>${i+1}</b>${esc(p.tiles.find(x=>x[0]===id)?.[1])} <span class="muted" style="margin-left:auto">✕</span></button>`).join('')||'<div class="dropzone">No instructions connected yet. Select a loose tile below.</div>'}</div><div class="caps gold" style="margin:17px 0 8px">LOOSE INSTRUCTION TILES</div><div class="sequence">${[p.tiles[2],p.tiles[0],p.tiles[3],p.tiles[1]].filter(x=>!(t.sequence||[]).includes(x[0])).map(([id,label])=>`<button class="sequence-step" data-act="seqadd" data-p="${p.id}" data-k="${id}"><b>＋</b>${esc(label)}</button>`).join('')||'<span class="pill ok">ALL FOUR CONNECTED</span>'}</div></div>`;

 return '<p>Missing puzzle mechanism.</p>'}
function placementsUI(p,t){const placed=t.placed||{},inUse=Object.values(placed),selected=t.selected||'';const labels=Object.fromEntries(p.tokens);const isHand=p.kind==='hand';const slots=p.slots.map(([k,label],i)=>isHand?`<button class="hand-finger ${placed[k]?'filled':''}" data-act="drop" data-p="${p.id}" data-k="${k}" data-dropzone="1" aria-label="Place clue for ${esc(label)}"><span class="finger-icon">${['🔴','🌡️','💧','⚡','✋'][i]}</span><strong>${esc(label)}</strong><span>${placed[k]?esc(labels[placed[k]]):'EMPTY'}</span></button>`:`<button class="dropzone ${placed[k]?'filled':''}" data-act="drop" data-p="${p.id}" data-k="${k}" data-dropzone="1"><small>${esc(label)}</small><strong>${placed[k]?esc(labels[placed[k]]):'◇ PLACE TILE HERE'}</strong></button>`).join('');return `<div class="machine"><div class="machine-h"><span>${isHand?'ANATOMICAL SIGN MAP':'EVIDENCE TRANSFER BAY'}</span><span class="light"></span></div>${isHand?`<div class="handchart">${slots}</div>`:`<div class="socket-grid">${slots}</div>`}<div class="caps gold" style="margin-top:18px">LOOSE EVIDENCE · SELECT A TILE, THEN A SLOT (OR DRAG)</div><div class="tokens">${p.tokens.map(([id,label])=>`<button class="token ${selected===id?'selected':''} ${inUse.includes(id)?'used':''}" data-act="token" data-p="${p.id}" data-k="${id}" draggable="true" title="Select or drag tile">${inUse.includes(id)?'✓ ':''}${esc(label)}</button>`).join('')}</div><p class="muted" style="font-size:.78rem">Tiles can be moved again. Tap a placed slot to remove or replace its tile.</p></div>`}
function cipherUI(p,t){const d=t.digits||[0,0,0,0];return `<div class="machine"><div class="machine-h">RESTRICTED EXIT / QUAD-ROTARY SAFE <span class="light"></span></div><div class="paper"><h3>LAST WORDS FROM THE DIRECTOR</h3><p><em>${esc(p.poem)}</em></p><small>Four seals. Four signals. One order that is not the hallway order.</small></div><p class="caps gold" style="margin:18px 0 8px">RECOVERED EVIDENCE SEALS</p><div class="inventory-items">${state.seals.map(x=>`<span class="inventory-item seal">${x.sigil} ${esc(x.name)}: ${x.digit}</span>`).join('')||'No seals recovered'}</div><div class="cipher">${d.map((num,i)=>`<div class="tumbler"><small>DIAL ${i+1}</small><button data-act="cipher" data-p="${p.id}" data-k="${i}" data-dir="1" aria-label="Increase dial ${i+1}">▲</button><strong>${num}</strong><button data-act="cipher" data-p="${p.id}" data-k="${i}" data-dir="-1" aria-label="Decrease dial ${i+1}">▼</button></div>`).join('')}</div><p class="muted" style="font-size:.8rem">The tumbler dials click into place one number at a time. Recover the order from the poem. The UV penlight can reveal an additional clue on the wall.</p></div>`}
function finish(){const allDomains=['ABGs','Inflammation','GI','Cardiac','Endocrine','Respiratory'],hints=Object.values(state.hints).reduce((a,b)=>a+b,0),attempts=state.errors;const label=attempts===0?'UNCHARTED GENIUS':attempts<=5?'STEADY HANDS':'INDESTRUCTIBLE STUDENT';return `<main class="finish"><div class="eyebrow">PATIENT DISCHARGE AUTHORIZED / CASE 13 CLOSED</div><h1>YOU<br>ESCAPED.</h1><p class="cover-quote" style="margin:0">“We regret to inform you that you passed. We had such plans.”</p><div class="panel panel-pad report"><div class="flex spaced"><h2>${label}</h2><span class="pill ok">FINAL DOOR RELEASED</span></div><div class="report-grid" style="margin:18px 0"><div class="report-card"><strong>${fmtClock()}</strong><small>ESCAPE TIME</small></div><div class="report-card"><strong>15/15</strong><small>LOCKS CLEARED</small></div><div class="report-card"><strong>${attempts} / ${hints}</strong><small>WRONG TRIES / HINTS</small></div></div><h3 class="gold" style="margin-bottom:8px">🚌 REMEDIATION BY DOMAIN</h3><div class="report-grid">${allDomains.map(domain=>{const ps=puzzles.filter(p=>p.domain===domain);const mis=ps.reduce((n,p)=>n+(state.misses[p.id]||0),0);return `<div class="report-card"><strong>${mis} misses</strong><small>${esc(domain)} · ${ps.length} locks</small></div>`}).join('')}</div><p class="muted" style="font-size:.87rem;margin-top:19px">Based on your six faculty remediation topics and course-review-derived summaries. This is practice, not an official exam. Missed locks are your next targeted review.</p><div class="buttons" style="margin-top:17px"><button class="btn primary" data-act="copy">COPY MY ESCAPE REPORT</button><button class="btn ghost" data-act="reset">REPLAY THE WARD</button></div></div></main>`}
function render(){header();if(!state.started){el.innerHTML=cover();return}if(state.paused){el.innerHTML=pauseScreen();return}if(state.finished){el.innerHTML=finish();return}el.innerHTML=roomScreen()}
function inspect(id){const o=rooms[state.room].objects.find(x=>x.id===id);if(!o)return;state.view=id;state.seen[id]=true;update({scroll:true});if(o.kind==='tool'&&!state.inventory.includes(o.item))toast(`A useful item is hiding here: ${o.item}. Take it into your inventory.`)}
function take(id){const o=rooms[state.room].objects.find(x=>x.id===id);if(!o?.item)return;if(!state.inventory.includes(o.item))state.inventory.push(o.item);update();toast(`${o.item} added to inventory. The ward does not seem pleased.`);pulse('good')}
function assignToken(pid,key,token){const t=w(pid);if(!t.placed)t.placed={};if(!token)token=t.selected;if(!token)return toast('Select a loose evidence tile first.',true);const p=getP(pid);if(!p.tokens.some(x=>x[0]===token))return;for(const k of Object.keys(t.placed)){if(t.placed[k]===token)delete t.placed[k]};if(t.placed[key]===token)delete t.placed[key];else t.placed[key]=token;t.selected=null;update();pulse('tick')}
function correct(p){const t=w(p.id),a=t.values||{};if(p.kind==='strips'||p.kind==='lever')return p.rows.every(([k,v,answer])=>a[k]===answer);
if(p.kind==='switch')return p.rows.every(([k,v,answer])=>Boolean(a[k])===answer);
if(p.kind==='valves')return p.valves.every(([id,label,opts,answer])=>(a[id]??1)===answer);
if(p.kind==='pathway')return t.node===p.answerNode&&p.sensors.every(([id,label,ans])=>Boolean(t.sensors?.[id])===ans);
if(p.kind==='adrenal')return p.cases.every(([id,story,h,diagnosis])=>a[id+'h']===h&&a[id+'d']===diagnosis);
if(p.kind==='sequence')return JSON.stringify(t.sequence||[])===JSON.stringify(p.answer);
if(p.kind==='cipher')return JSON.stringify(t.digits||[])===JSON.stringify(p.answer);
if(p.kind==='place'||p.kind==='hand'){
 const vals=t.placed||{},entries=Object.keys(p.answer);if(entries.some(k=>!vals[k]))return false;
 if(p.unorderedGroups){return p.unorderedGroups.every(group=>group.map(k=>vals[k]).sort().join('|')===group.map(k=>p.answer[k]).sort().join('|'))}
 return entries.every(k=>p.answer[k]===vals[k]);}
return false}
function submit(pid){const p=getP(pid);if(!p||state.done[pid])return;if(correct(p)){state.done[pid]=true;state.view=p.id==='exit'?null:state.view;if(p.id==='exit'){state.finished=true;save();render();pulse('victory');return}update();toast(`LOCK ${String(p.num).padStart(2,'0')} RELEASED. ${p.why.slice(0,116)}…`);pulse('good');if(roomDone())toast('All three locks opened. The room gate is ready; recover the seal and proceed.');}else{state.errors++;state.misses[pid]=(state.misses[pid]||0)+1;update();toast('The relay rejects the configuration. Reinspect the evidence or ask for a hint.',true);pulse('error')}}
function hint(pid){const p=getP(pid);if(!p||state.done[pid])return;state.hints[pid]=Math.min(2,(state.hints[pid]||0)+1);update();pulse('tick');if(state.hints[pid]===2)toast('Both clues revealed. The ward has run out of mercy.')}
function advance(){if(!roomDone()||state.room>=4)return;const r=rooms[state.room];state.seals.push({sigil:r.sigil,name:r.sealName,digit:r.seal});state.room++;state.view=null;update();window.scrollTo({top:0,behavior:'smooth'});toast(`EVIDENCE SEAL RECOVERED: ${r.sigil} ${r.sealName} / ${r.seal}. A door opens.`);pulse('good')}
function copyReport(){const domains=['ABGs','Inflammation','GI','Cardiac','Endocrine','Respiratory'],sum=domains.map(x=>`${x}: ${puzzles.filter(p=>p.domain===x).reduce((n,p)=>n+(state.misses[p.id]||0),0)} missed attempts`).join('\n');const msg=`WARD 13 — AFTER HOURS / PHARMACOLOGY ESCAPE REPORT\nAll 5 rooms and 15 locks cleared\nTime: ${fmtClock()} | False attempts: ${state.errors} | Hints: ${Object.values(state.hints).reduce((a,b)=>a+b,0)}\n\n${sum}\n\nRemediation: ABGs; five inflammatory signs / glucocorticoids; Crohn/UC/cirrhosis; preload/afterload and antihypertensives; diabetes/adrenal disorders; respiratory medication teaching.`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>toast('Escape report copied!')).catch(()=>prompt('Copy your report:',msg));else prompt('Copy your report:',msg)}
function action(target){const act=target.dataset.act,pid=target.dataset.p,key=target.dataset.k,v=target.dataset.v;let t=pid?w(pid):null;
 if(act==='start'){state.started=true;state.notice=null;update();pulse('good')}
 else if(act==='rules'){state.notice='Explore by tapping objects in the illustrated room. Inspect evidence, collect tools, manipulate equipment, and open all three locks to reach the next room. Select tiles then targets (or drag them on desktop). Four evidence seals are needed for the final door. All six pharmacology remediation topics are included. No countdown; progress saves locally where supported.';if(!state.started)update();else toast(state.notice)}
 else if(act==='inspect')inspect(target.dataset.id)
 else if(act==='take')take(target.dataset.id)
 else if(act==='close'){state.view=null;update()}
 else if(act==='pause'){state.paused=!state.paused;update()}
 else if(act==='reset'){if(confirm('Erase progress for WARD 13: After Hours and begin again?')){state=initial();update();window.scrollTo(0,0)}}
 else if(act==='advance')advance()
 else if(act==='submit')submit(pid)
 else if(act==='hint')hint(pid)
 else if(act==='clear'){state.work[pid]={};update()}
 else if(act==='pick'){if(!t.values)t.values={};t.values[key]=v;update();pulse('tick')}
 else if(act==='toggle'){if(!t.values)t.values={};t.values[key]=!t.values[key];update();pulse('tick')}
 else if(act==='dial'){if(!t.values)t.values={};t.values[key]=((t.values[key]??1)+1)%3;update();pulse('tick')}
 else if(act==='node'){t.node=Number(v);update();pulse('tick')}
 else if(act==='sensor'){if(!t.sensors)t.sensors={};t.sensors[key]=!t.sensors[key];update();pulse('tick')}
 else if(act==='token'){t.selected=t.selected===key?null:key;update();pulse('tick')}
 else if(act==='drop'){
  if(!t.selected&&t.placed?.[key]){delete t.placed[key];update()}else assignToken(pid,key);
 }
 else if(act==='seqadd'){if(!t.sequence)t.sequence=[];if(!t.sequence.includes(key))t.sequence.push(key);update();pulse('tick')}
 else if(act==='seqremove'){t.sequence=(t.sequence||[]).filter(x=>x!==key);update()}
 else if(act==='cipher'){if(!t.digits)t.digits=[0,0,0,0];t.digits[Number(key)]=(t.digits[Number(key)]+10+Number(target.dataset.dir||1))%10;update();pulse('tick')}
 else if(act==='copy')copyReport()
 else if(act==='sound'){state.sound=!state.sound;update();soundToggle()}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)action(t)});
el.addEventListener('dragstart',e=>{const b=e.target.closest('[data-act="token"]');if(b){e.dataTransfer?.setData('text/plain',JSON.stringify({p:b.dataset.p,id:b.dataset.k}));if(e.dataTransfer)e.dataTransfer.effectAllowed='move'}});
el.addEventListener('dragover',e=>{if(e.target.closest('[data-dropzone]'))e.preventDefault()});
el.addEventListener('drop',e=>{const b=e.target.closest('[data-dropzone]');if(!b)return;e.preventDefault();let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(err){return}if(d.p===b.dataset.p)assignToken(d.p,b.dataset.k,d.id)});
let audioContext=null,oscillator=null,gainNode=null;
function soundToggle(){try{if(!state.sound){if(gainNode)gainNode.gain.setTargetAtTime(0,audioContext.currentTime,.05);return}audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();if(!oscillator){oscillator=audioContext.createOscillator();gainNode=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=63;gainNode.gain.value=0;oscillator.connect(gainNode);gainNode.connect(audioContext.destination);oscillator.start()}gainNode.gain.setTargetAtTime(.012,audioContext.currentTime,.2)}catch(e){state.sound=false;update()}}
function pulse(type){if(!state.sound||!audioContext)return;try{const o=audioContext.createOscillator(),g=audioContext.createGain(),now=audioContext.currentTime;o.type=type==='error'?'sawtooth':'sine';o.frequency.setValueAtTime(type==='error'?122:type==='victory'?420:380,now);o.frequency.exponentialRampToValueAtTime(type==='error'?86:type==='victory'?680:type==='good'?580:340,now+.19);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045,now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+.24);o.connect(g);g.connect(audioContext.destination);o.start(now);o.stop(now+.26)}catch(e){}}
setInterval(()=>{if(state.started&&!state.paused&&!state.finished){state.elapsed++;if(state.elapsed%15===0)save();const t=document.getElementById('live-clock');if(t)t.textContent=fmtClock()}},1000);
render();
window.WARD13={get state(){return state},rooms,puzzles,correct,render};
</script>
