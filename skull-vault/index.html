function drawHome(){const seals=s.cleared;const missions=[['slider','THE SKULL MOSAIC','A real sliding-tile cranium. 3×3 mechanical puzzle, shuffle and oracle hints.','💀',200],['switch','THE NERVE SWITCHBOARD','Connect symptom parchments to cranial nerve runes with glowing wires.','⚡',260],['forge','THE REFLEX FORGE','Build input/output reflex circuits with runestones.','🔮',240],['boss','THE MIMIC OF FIVE','Survive five clinical illusions and choose a confirming exam.','🐉',380]];let h='<section class="hero"><div class="heroCopy"><span class="label">A BONUS SIDE QUEST FOR THE VEIL OF SENSES</span><h1>The Skull<br>Vault</h1><p>The sorcerer M.I.M.I.C. has stolen five cranial pathways. Reassemble your own skull, reconnect the nerves, and forge three reflexes before facing him.</p><div class="actions">'+btn('💀 Repair your cranium','go_slider')+btn('📜 Learn the five nerves','go_codex','secondary')+'</div></div><div class="heroSkull">'+skullSVG(s.theme)+'</div></section>';

function claimClear(zone,base){const first=!s.cleared.includes(zone);if(first){s.cleared.push(zone);earn(base);showToast('🏆 First clear! +'+base+' tickets');}else{const day=new Date().toISOString().slice(0,10);if(s.replays[zone]!==day){s.replays[zone]=day;earn(24);showToast('🎟️ Daily practice reward +24 tickets')}else showToast('Practice complete — today’s replay ticket reward already claimed.')}save();return first}
const ADJ=[ [1,3],[0,2,4],[1,5],[0,4,6],[1,3,5,7],[2,4,8],[3,7],[4,6,8],[5,7] ];
const GOAL=[1,2,3,4,5,6,7,8,0];
function puzzleNew(){let tiles=GOAL.slice(),empty=8,last=-1;for(let k=0;k<23;k++){let opts=ADJ[empty].filter(i=>i!==last);let next=opts[Math.floor(Math.random()*opts.length)];[tiles[empty],tiles[next]]=[tiles[next],tiles[empty]];last=empty;empty=next}return {tiles,moves:0,hints:0,numberHelp:false,highlight:null,finished:false,best:null}}
function puzzle(){if(!s.slider)s.slider=puzzleNew();return s.slider}
function isGoal(tiles){return tiles.every((x,i)=>x===GOAL[i])}
function manhattan(t){let z=0;for(let i=0;i<9;i++){let v=t[i];if(v){let goal=v-1;z+=Math.abs(Math.floor(i/3)-Math.floor(goal/3))+Math.abs(i%3-goal%3)}}return z}
function optimalMove(t){if(isGoal(t))return null;let key=a=>a.join(''),pq=[{t:t.slice(),g:0,h:manhattan(t),first:null}],dist=new Map([[key(t),0]]),loops=0;while(pq.length&&loops<55000){pq.sort((a,b)=>(a.g+a.h)-(b.g+b.h)||a.h-b.h);const cur=pq.shift(),k=key(cur.t);if(cur.g!==dist.get(k))continue;if(cur.h===0)return cur.first;const z=cur.t.indexOf(0);for(const n of ADJ[z]){let arr=cur.t.slice();[arr[z],arr[n]]=[arr[n],arr[z]];let nk=key(arr),ng=cur.g+1;if(ng<(dist.get(nk)??Infinity)){dist.set(nk,ng);pq.push({t:arr,g:ng,h:manhattan(arr),first:cur.first===null?n:cur.first})}}loops++}return null}
function drawSlider(){const p=puzzle(),img=svgData(),done=p.finished||isGoal(p.tiles);let h='<section class="panel"><span class="label">CHAMBER I — THE SKULL MOSAIC</span><h2>💀 Piece together your cranium</h2><p>Slide a tile beside the empty square until the skull is reconstructed. Every scramble is made through legal sliding moves, so it is always solvable. Use <b>Oracle Hint</b> if your actual cranium starts overheating.</p><div class="avatarPick">'+[['aqua','🟢 Ghostfire'],['violet','🟣 Amethyst'],['gold','🟡 Goldfire']].map(x=>'<button data-theme="'+x[0]+'" class="'+(s.theme===x[0]?'picked':'')+'">'+x[1]+'</button>').join('')+'</div><div class="puzzleWrap"><div><div class="skullBoard" aria-label="3 by 3 skull sliding puzzle">';
p.tiles.forEach((v,pos)=>{if(!v){h+='<div class="tile empty" aria-label="Empty sliding slot"></div>';return}const piece=v-1;const px=(piece%3)*50,py=Math.floor(piece/3)*50;h+='<button class="tile '+(p.highlight===pos?'hinted':'')+'" data-slide="'+pos+'" aria-label="Move skull tile '+v+'" style="background-image:url(&quot;'+img+'&quot;);background-position:'+px+'% '+py+'%">'+(s.showNumbers?'<span class="num">'+v+'</span>':'')+'</button>'});h+='</div><div class="skullStats"><span>🧩 '+p.moves+' moves</span><span>🔮 '+p.hints+' assists</span><span>'+ (done?'✅ Reassembled':'🔒 Still scrambled')+'</span></div></div><div><div class="notice"><b>🧠 Teaching moment:</b> This is a spatial puzzle, not a memorization quiz. The next room turns your assembled cranium into a nerve switchboard. <b>Number overlay</b> is available for accessibility.</div><div class="actions">'+btn('🔮 Oracle: highlight next move','hint')+btn('✨ Wizard: move one tile','autoMove','secondary')+btn(s.showNumbers?'Hide tile numbers':'Show tile numbers','numbers','ghost')+btn('↻ Fresh scramble','scramble','warn')+'</div>'+ (done?'<div class="notice"><b>🎉 Cranium restored!</b><p>Your skull has been promoted to Level: Slightly Less Cursed.</p>'+btn('⚡ Continue to the Switchboard','go_switch')+'</div>':'')+'</div></div></section>';$('content').innerHTML=h}
function slideMove(pos,assisted=false){const p=puzzle();if(p.finished)return false;const z=p.tiles.indexOf(0);if(!ADJ[z].includes(pos))return false;[p.tiles[z],p.tiles[pos]]=[p.tiles[pos],p.tiles[z]];p.moves++;if(assisted)p.hints++;p.highlight=null;if(isGoal(p.tiles)){p.finished=true;let first=claimClear('slider',200);const bonus=first?Math.max(0,130-Math.max(0,p.moves-23)*3-p.hints*14):0;if(bonus)earn(bonus);save();modal('<span class="label">RECONSTRUCTION COMPLETE</span><h2>💀 That skull is yours!</h2><p>Finished in <b>'+p.moves+' moves</b> with '+p.hints+' wizard assists.</p><p>🎟️ '+(first?'200 first-clear tickets + '+bonus+' skill bonus':'Daily replay reward if available')+'</p><div class="actions">'+btn('⚡ The next chamber','nextSwitch')+btn('Close','close','secondary')+'</div>')}save();drawSlider();return true}
function hintMove(auto){const p=puzzle();if(p.finished)return;const step=optimalMove(p.tiles);if(step===null){showToast('The Oracle cannot find a move right now. Try a new scramble.');return}if(auto)slideMove(step,true);else{p.highlight=step;p.hints++;save();drawSlider();showToast('✨ The glowing tile is an optimal next move.')}}
const SWITCH_IDS=['III','V','IX','X','XI'];const FOILS=['IV','VI','VII','XII'];

function drawSwitch(){const x=switchState();let h='<section class="panel"><span class="label">CHAMBER II — NERVE SWITCHBOARD</span><h2>⚡ Reconnect the cut nerve wires</h2><p>Tap a symptom parchment on the left, then connect it to a cranial-nerve rune on the right. Each successful pairing draws a live glowing wire. The runes and clues shuffle in each new round.</p><div class="switchBoard" id="switchBoard"><svg class="wireLayer" id="wireLayer" aria-hidden="true"></svg><div class="socketCol">'+x.cases.map((a,i)=>'<button class="socket '+(x.picked===i?'clueSelected':'')+' '+(x.matched.includes(a.id)?'matched':'')+'" data-clue="'+i+'" '+(x.matched.includes(a.id)?'disabled':'')+'><small>CASE '+(i+1)+'</small><span class="sub">'+escapeHtml(a.clue)+'</span></button>').join('')+'</div><div class="socketCol">'+x.runes.map(id=>'<button class="socket rune '+(x.matched.includes(id)?'matched':'')+'" data-wire="'+id+'" '+(x.matched.includes(id)?'disabled':'')+'><span class="badge">'+id+'</span><span>'+NERVE[id].icon+' '+NERVE[id].name+'</span></button>').join('')+'</div></div><div class="skullStats"><span>🔌 '+x.matched.length+'/'+x.cases.length+' wires repaired</span><span>⚠ '+x.miss+' mistakes</span></div><div class="actions">'+btn('📜 Teaching codex','go_codex','secondary')+(x.cleared?btn('🔮 Enter the Reflex Forge','go_forge'):'')+btn('↻ Reshuffle new case set','switchReset','ghost')+'</div></section>';$('content').innerHTML=h;setTimeout(drawWires,0)}
function drawWires(){const root=$('switchBoard'),svg=$('wireLayer');if(!root||!svg||page!=='switch')return;const x=switchState(),box=root.getBoundingClientRect();let lines='';for(let i=0;i<x.cases.length;i++){const id=x.cases[i].id;if(!x.matched.includes(id))continue;const l=document.querySelector('[data-clue="'+i+'"]'),r=document.querySelector('[data-wire="'+id+'"]');if(!l||!r)continue;let a=l.getBoundingClientRect(),b=r.getBoundingClientRect(),ax=a.right-box.left,ay=a.top-box.top+a.height/2,bx=b.left-box.left,by=b.top-box.top+b.height/2;lines+='<path d="M'+ax+' '+ay+' C'+(ax+20)+' '+ay+' '+(bx-20)+' '+by+' '+bx+' '+by+'" stroke="#9ffbd1" stroke-width="3" fill="none" opacity=".9"/>'}svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);svg.innerHTML=lines}
function selectClue(i){let x=switchState();if(x.matched.includes(x.cases[i].id))return;x.picked=i;save();drawSwitch()}
function connect(id){let x=switchState();if(x.picked===null){showToast('First select a symptom parchment on the left.');return}let q=x.cases[x.picked],tries=x.tries[q.id]||0;if(q.id===id){x.matched.push(id);if(!s.firstTry[id])s.firstTry[id]={wins:0,misses:0};if(tries===0)s.firstTry[id].wins++;s.winCount[id]=(s.winCount[id]||0)+1;x.picked=null;showToast('⚡ Connected! '+NERVE[id].function);if(x.matched.length===x.cases.length){x.cleared=true;const first=claimClear('switch',260);if(first){let bonus=Math.max(0,105-x.miss*12);earn(bonus)}modal('<span class="label">SWITCHBOARD RESTORED</span><h2>⚡ Every signal is flowing!</h2><p>Correctly connected '+x.matched.length+' cranial pathways with '+x.miss+' incorrect attempts.</p><p>🎟️ The vault has rewarded your work.</p><div class="actions">'+btn('🔮 Next: Reflex Forge','nextForge')+btn('Return to wires','close','secondary')+'</div>')}}else{x.tries[q.id]=tries+1;x.miss++;s.attempts++;s.mistakes.push({zone:'Switchboard',nerve:q.id,clue:q.clue,choice:id,why:NERVE[q.id].contrast});if(!s.firstTry[q.id])s.firstTry[q.id]={wins:0,misses:0};s.firstTry[q.id].misses++;showToast('❌ That was CN '+id+'. The correct clue is '+NERVE[q.id].where+'.');}save();drawSwitch()}

function boss(){if(!s.boss)s.boss=bossNew();return s.boss}
function drawBoss(){const x=boss();if(x.cleared){$('content').innerHTML='<section class="panel"><span class="label">THE MIMIC IS DEFEATED</span><h2>🐉 The five cranial pathways are restored!</h2><p>The Skullbreaker Guild Seal has been added to your shared collectible gallery. Fight again for daily training or spend your tickets at the merchant.</p><div class="actions">'+btn('🏆 View gallery','go_gallery')+btn('↻ Rematch','bossReset','secondary')+'</div></section>';return}const id=x.order[x.pos],q=BOSS.find(a=>a.id===id),examOptions=mix(q.choices);if(!x.currentExams)x.currentExams={};if(!x.currentExams[id])x.currentExams[id]=examOptions;let h='<section class="panel"><span class="label">FINAL ROOM — THE MIMIC OF FIVE</span><h2>🐉 Diagnose the illusion</h2><div class="scene"><span>👁️</span><span>🧙</span><span>🐉</span></div><p>The Mimic projects a misleading clinical chart. You must identify the cranial nerve <b>and</b> choose the examination finding that confirms your choice. Both are required to banish the illusion.</p><div class="bossMed"><h3>📋 Patient '+(x.pos+1)+' of 5</h3><p>'+q.case+'</p></div><h3>1. Identify the affected nerve</h3><div class="optionGrid">'+x.nerveOptions.map(n=>'<button class="option '+(x.pickNerve===n?'selected':'')+'" data-bossnerve="'+n+'">CN '+n+' — '+NERVE[n].name+'</button>').join('')+'</div><h3 style="margin-top:19px">2. Select a focused confirming assessment</h3><div class="optionGrid">'+x.currentExams[id].map((choice,i)=>'<button class="option '+(x.pickExam===choice?'selected':'')+'" data-bossexam="'+i+'">'+escapeHtml(choice)+'</button>').join('')+'</div><div class="count"><span>🐲 Illusions '+x.pos+'/5</span><span>⚠ '+x.miss+' misses</span><span>🎯 '+x.firstWins+' first-try wins</span></div><div class="actions">'+btn('⚔️ Shatter the illusion','bossCheck')+btn('📜 Recall clinical distinctions','go_codex','secondary')+'</div></section>';$('content').innerHTML=h}
function bossCheck(){const x=boss(),id=x.order[x.pos],q=BOSS.find(a=>a.id===id);if(!x.pickNerve||!x.pickExam){showToast('Choose both a nerve and a confirming finding.');return}const ok=x.pickNerve===id&&x.pickExam===q.test;const tries=x.tries[id]||0;if(ok){if(tries===0){x.firstWins++;if(!s.firstTry[id])s.firstTry[id]={wins:0,misses:0};s.firstTry[id].wins++}s.winCount[id]=(s.winCount[id]||0)+1;x.pos++;x.pickNerve=null;x.pickExam=null;if(x.pos>=5){x.cleared=true;const first=claimClear('boss',380);if(first){earn(x.firstWins*35);award('skull_crest')}modal('<span class="label">BOSS DEFEATED · GUILD VICTORY</span><h2>🐲 The Mimic has fallen!</h2><p><b>'+x.firstWins+'/5</b> illusions broken on the first attempt. '+x.miss+' total missed attempts.</p><p>🏵️ Boss-exclusive Skullbreaker Guild Seal awarded on your first clear. The merchant has also unlocked legendary relics.</p><div class="actions">'+btn('🏆 View your treasures','nextGallery')+btn('Close','close','secondary')+'</div>')}else modal('<span class="label">ILLUSION BROKEN</span><h2>✨ CN '+id+' — '+NERVE[id].name+'</h2><p>'+NERVE[id].function+'</p><p><b>Exam:</b> '+q.test+'</p><div class="actions">'+btn('Continue battle','close')+'</div>');}else{x.miss++;x.tries[id]=tries+1;s.attempts++;if(!s.firstTry[id])s.firstTry[id]={wins:0,misses:0};s.firstTry[id].misses++;s.mistakes.push({zone:'Mimic',nerve:id,clue:q.case,choice:'CN '+x.pickNerve+' + '+x.pickExam,why:NERVE[id].contrast});modal('<span class="label">THE MIMIC STRIKES</span><h2>⚠ A misleading signal!</h2><p>'+NERVE[id].contrast+'</p><p><b>Think anatomically:</b> '+NERVE[id].function+'</p>'+btn('Try again','close'));}save();drawBoss()}
function drawShop(){const w=getWallet();let h='<section class="panel"><span class="label">GUILD’S BLACK-MARKET MERCHANT</span><h2>🎟️ Relics of the Cranium</h2><p>The Skull Vault uses your existing Midnight Midway ticket wallet. The rare and legendary rewards cost more than one dungeon run; quest milestones unlock them, and your older collectibles remain yours.</p><span class="goldText"><b>'+money(w.tickets)+' tickets available</b></span></section><section class="rewardGrid">'+REWARDS.map(p=>{const own=w.owned.includes(p.id),unlock=s.cleared.includes(p.unlock);return '<article class="reward"><div class="big">'+p.icon+'</div><small class="tag">'+p.rarity+(own?' · OWNED':'')+'</small><h3>'+p.name+'</h3><p>'+p.desc+'</p><b class="goldText">'+(p.price===null?'Defeat the Mimic':own?'✓ On your shelf':'🎟️ '+money(p.price))+'</b>'+(!own&&!unlock?'<small>🔒 Clear '+({slider:'Skull Mosaic',forge:'Reflex Forge',boss:'The Mimic'}[p.unlock]||p.unlock)+' first</small>':'')+'<button class="action '+(own?'secondary':'')+'" data-prize="'+p.id+'" '+(!own&&(p.price===null||!unlock||w.tickets<p.price)?'disabled':'')+'>'+ (own?'Inspect collectible':'Redeem treasure')+'</button></article>'}).join('')+'</section>';$('content').innerHTML=h}
function getPrize(id){return REWARDS.find(p=>p.id===id)||{id,name:LABELS[id]?.[0]||id,icon:LABELS[id]?.[1]||'💎',rarity:'Midway collectible',pearl:'A treasure from your linked nursing study games.',price:null}}
function drawGallery(){const w=getWallet();let h='<section class="panel"><span class="label">THE PERSISTENT TROPHY GALLERY</span><h2>🏆 Your cranium’s treasure shelf</h2><p>Every purchased carnival, fantasy, and Skull Vault collectible lives in this shared wallet. Tap an item to see its clinical pearl, favorite it, and add a private study mnemonic. Saved notes are shared with the carnival gallery.</p><span class="goldText"><b>'+w.owned.length+' treasures · '+money(w.tickets)+' tickets</b></span></section><section class="rewardGrid">'+w.owned.map(id=>{const p=getPrize(id);return '<article class="reward"><div class="big">'+p.icon+'</div><small class="tag">'+p.rarity+(w.favorites.includes(id)?' · ★ FAVORITE':'')+'</small><h3>'+escapeHtml(p.name)+'</h3><p>'+escapeHtml(p.pearl)+'</p><button class="action secondary" data-detail="'+id+'">📚 Study this treasure</button></article>'}).join('')+'</section>';$('content').innerHTML=h}
function prizeDetail(id){const w=getWallet();if(!w.owned.includes(id))return;const p=getPrize(id);detailPrize=id;modal('<span class="label">GUILD GALLERY · '+p.rarity+'</span><h2>'+p.icon+' '+escapeHtml(p.name)+'</h2><div class="notice">🧠 '+escapeHtml(p.pearl)+'</div><label for="studyNote">Your private study mnemonic</label><textarea id="studyNote" class="textarea" style="min-height:120px" maxlength="1500">'+escapeHtml(w.notes[id]||'')+'</textarea><div class="actions">'+btn('💾 Save study note','saveNote')+btn(w.favorites.includes(id)?'★ Unfavorite':'☆ Favorite','favorite','secondary')+btn('Close','close','secondary')+'</div>')}
function drawReport(){const w=getWallet();const txt=s.mistakes.slice().reverse();let h='<section class="panel"><span class="label">CRANIAL REMEDIATION LOG</span><h2>📋 Your dungeon results</h2><p>First-attempt wins are separate from retries. That matters more than whether you eventually powered through every nerve.</p><div class="count"><span>✅ '+s.cleared.length+'/4 seals</span><span>🎟️ '+money(w.tickets)+' tickets</span><span>⚠ '+s.attempts+' wrong attempts</span></div><div class="actions">'+btn('📋 Copy study report','share')+btn('💾 Backup game + wallet','backup','secondary')+btn('📥 Restore carnival backup','restore','secondary')+'</div></section><section class="panel"><h3>Focus-nerve mastery</h3>'+FOCUS.map(id=>{const p=s.firstTry[id]||{wins:0,misses:0};return '<div class="logRow"><b>CN '+id+' — '+NERVE[id].name+'</b><p>First-try wins: '+p.wins+' · Incorrect attempts: '+p.misses+'</p><small>'+NERVE[id].function+'</small></div>'}).join('')+'</section><section class="panel"><h3>Review these missed encounters</h3>'+(txt.length?txt.slice(0,50).map(q=>'<div class="logRow"><b>'+escapeHtml(q.zone)+' · CN '+escapeHtml(q.nerve)+'</b><p>'+escapeHtml(q.clue)+'</p><small>Corrective clue: '+escapeHtml(q.why)+'</small></div>').join(''):'No wrong attempts logged. The Mimic requests additional supervision.')+'</section>';$('content').innerHTML=h}
function studyReport(){const w=getWallet();return ['WARD 13 — SKULL VAULT CRANIAL NERVE REPORT','Vault seals '+s.cleared.length+'/4','Tickets available '+w.tickets,'Lifetime earned '+w.lifetime,'Total wrong attempts '+s.attempts,'Collectibles '+w.owned.map(id=>getPrize(id).name).join(', '),'','CRANIAL NERVE FOCUS',...FOCUS.map(id=>id+' '+NERVE[id].name+': '+(s.firstTry[id]?.wins||0)+' first-try wins; '+(s.firstTry[id]?.misses||0)+' wrong attempts'),'','SKULL SLIDER: '+(s.slider?.finished?'Solved in '+s.slider.moves+' moves, '+s.slider.hints+' hints':'Not completed'),'SWITCHBOARD: '+(s.switchboard?.matched.length||0)+' connected; '+(s.switchboard?.miss||0)+' errors','REFLEX FORGE: '+(s.forge?.pos||0)+' of 3 circuits; '+(s.forge?.miss||0)+' errors','MIMIC BOSS: '+(s.boss?.pos||0)+' of 5 illusions; '+(s.boss?.miss||0)+' errors','','MISSED QUESTIONS',...s.mistakes.map(x=>x.zone+': '+x.clue+' | Your choice: '+x.choice+' | '+x.why)].join('\n')}
function exportData(kind){const data=kind==='share'?studyReport():JSON.stringify({vault:s,carnival:getWallet()},null,2);modal('<h2>'+ (kind==='share'?'📋 Share your clinical results':'💾 Backup your collections')+'</h2><p>Copy the following text. Nothing is automatically sent to a server.</p><textarea id="exportText" class="textarea" readonly></textarea><div class="actions">'+btn('Copy text','copy')+btn('Close','close','secondary')+'</div>');$('exportText').value=data}
function restoreDialog(){modal('<h2>📥 Restore a carnival wallet</h2><p>Paste the JSON from Midnight Midway’s Results → Backup Save, or a combined Skull Vault backup. Existing progress will only be replaced if you explicitly confirm.</p><textarea id="restoreText" class="textarea"></textarea><div class="actions">'+btn('Restore wallet','restoreApply')+btn('Cancel','close','secondary')+'</div>')}
function restoreApply(){try{const obj=JSON.parse($('restoreText').value),w=obj.carnival||obj;if(w.version!==1||!Array.isArray(w.owned)||!Number.isFinite(w.tickets)||w.tickets<0)throw Error('Invalid');if(!confirm('Replace your current carnival ticket wallet and collectibles with this backup?'))return;putWallet({...emptyWallet(),...w});closeModal();showToast('🎟️ Carnival wallet restored.')}catch(e){showToast('Invalid backup. Your saves were not changed.')}}
function snapshot(){if(!s.legacyPending||s.snapshotImported){showToast('An existing wallet is protected; use a deliberate JSON backup restore instead.');return}if(!confirm('Merge your previously reported 3,963 tickets, 7,248 lifetime earnings and eight trophies with any tickets earned in this new browser? This can only be done once.'))return;let w=getWallet();w.tickets+=3963;w.lifetime+=7248;w.owned=[...new Set(w.owned.concat(['parade','fortuneDeck','crown','ferris','veil_crest','veil_dice','cotton','steth']))];putWallet(w);s.snapshotImported=true;s.legacyPending=false;save();draw();showToast('🎟️ Previously reported wallet merged with this adventure.')}
function resetStage(zone){if(!confirm('Start a new practice round here? Previously earned tickets and collectibles are preserved.'))return;if(zone==='slider')s.slider=puzzleNew();if(zone==='switch')s.switchboard=switchNew();if(zone==='forge')s.forge=reflexNew();if(zone==='boss')s.boss=bossNew();save();draw()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
if(d.nav){setPage(d.nav);return}
if(d.theme){s.theme=d.theme;save();drawSlider();return}
if(d.teach){if(!s.teaching.includes(d.teach)){s.teaching.push(d.teach);if(s.teaching.length===5&&!s.achievements.includes('codex')){s.achievements.push('codex');earn(60);showToast('📜 All five nerve scrolls read! +60 study tickets')}}save();drawCodex();return}
if(d.slide!==undefined){slideMove(Number(d.slide));return}
if(d.clue!==undefined){selectClue(Number(d.clue));return}
if(d.wire){connect(d.wire);return}
if(d.stone){forgeStone(d.stone);return}
if(d.slot!==undefined){let x=reflex();x.slots.splice(Number(d.slot),1);save();drawForge();return}
if(d.bossnerve){boss().pickNerve=d.bossnerve;save();drawBoss();return}
if(d.bossexam!==undefined){let x=boss(),id=x.order[x.pos];x.pickExam=x.currentExams[id][Number(d.bossexam)];save();drawBoss();return}
if(d.prize){const p=REWARDS.find(q=>q.id===d.prize);if(!p)return;if(getWallet().owned.includes(p.id)){prizeDetail(p.id);return}if(!s.cleared.includes(p.unlock)||p.price===null)return;if(purchase(p)){drawShop();showToast('🏆 '+p.name+' added to your shared collection')}return}
if(d.detail){prizeDetail(d.detail);return}
const a=d.act;if(!a)return;
if(a.startsWith('go_')){setPage(a.slice(3));return}
if(a==='hint'){hintMove(false);return}
if(a==='autoMove'){hintMove(true);return}
if(a==='numbers'){s.showNumbers=!s.showNumbers;save();drawSlider();return}
if(a==='scramble'){resetStage('slider');return}
if(a==='switchReset'){resetStage('switch');return}
if(a==='forgeReset'){resetStage('forge');return}
if(a==='bossReset'){resetStage('boss');return}
if(a==='forgeCheck'){forgeCheck();return}
if(a==='forgeClear'){reflex().slots=[];save();drawForge();return}
if(a==='bossCheck'){bossCheck();return}
if(a==='nextSwitch'){closeModal();setPage('switch');return}
if(a==='nextForge'){closeModal();setPage('forge');return}
if(a==='nextBoss'){closeModal();setPage('boss');return}
if(a==='nextGallery'){closeModal();setPage('gallery');return}
if(a==='close'){closeModal();return}
if(a==='share'||a==='backup'){exportData(a);return}
if(a==='restore'){restoreDialog();return}
if(a==='restoreApply'){restoreApply();return}
if(a==='snapshot'){snapshot();return}
if(a==='saveNote'){if(detailPrize){const val=$('studyNote').value;mutateWallet(w=>{if(w.owned.includes(detailPrize))w.notes[detailPrize]=val.slice(0,1500)});showToast('📚 Study note saved!')}return}
if(a==='favorite'){if(detailPrize){let id=detailPrize;mutateWallet(w=>{if(w.owned.includes(id))w.favorites=w.favorites.includes(id)?w.favorites.filter(z=>z!==id):w.favorites.concat(id)});prizeDetail(id)}return}
if(a==='copy'){const ta=$('exportText');try{await navigator.clipboard.writeText(ta.value);showToast('Report copied!')}catch(x){ta.focus();ta.select();showToast('Select all and copy this text manually')}return}
});
window.addEventListener('resize',()=>{if(page==='switch')drawWires()});
window.addEventListener('storage',e=>{if(e.key===WALLET||e.key===SAVE){if(e.key===SAVE)s=load();draw()}});
window.addEventListener('focus',()=>draw());
draw();
</script></body></html>
