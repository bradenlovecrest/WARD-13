<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Abandoned hospital treatment room with a medication cart, curtained bay and glowing cardiac monitor">
<defs>
<linearGradient id="wall" x2="0" y2="1"><stop stop-color="#233c43"/><stop offset=".65" stop-color="#1c3137"/><stop offset="1" stop-color="#0a1920"/></linearGradient>
<linearGradient id="floor" x2=".1" y2="1"><stop stop-color="#43575a"/><stop offset="1" stop-color="#121e25"/></linearGradient>
<radialGradient id="lamp"><stop stop-color="#e0f2d4" stop-opacity=".4"/><stop offset=".55" stop-color="#9ec3b6" stop-opacity=".1"/><stop offset="1" stop-color="#96d7c0" stop-opacity="0"/></radialGradient>
<linearGradient id="curtain"><stop stop-color="#6b807c"/><stop offset=".27" stop-color="#304f55"/><stop offset=".55" stop-color="#73908b"/><stop offset=".88" stop-color="#2b4751"/><stop offset="1" stop-color="#192f38"/></linearGradient>
<linearGradient id="glass" x2="1" y2=".8"><stop stop-color="#5c8d89" stop-opacity=".5"/><stop offset="1" stop-color="#101e26" stop-opacity=".4"/></linearGradient>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer></filter>
</defs>
